name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 기상청 실시간 자료 갱신
  workflow_dispatch:
    inputs:
      days:
        description: '일자료 받을 기간(일) — 처음 1회는 1095(3년) 권장'
        default: '3'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch KMA data
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
          DAYS: ${{ github.event.inputs.days || '3' }}
        run: |
          set +e
          STN='^(156|165|168|169|170|174|175|260|261|262)$'
          BASE='https://apihub.kma.go.kr/api/typ01/url'
          filt(){ awk -v re="$STN" '/^#/ || ($2 ~ re)'; }
          mkdir -p wx_data/daily
          curl -sf --max-time 30 "$BASE/kma_sfctm2.php?stn=0&disp=0&help=1&authKey=$KMA_KEY" | iconv -f euc-kr -t utf-8 -c | filt > wx_data/now.tmp \
            && [ -s wx_data/now.tmp ] && mv wx_data/now.tmp wx_data/now.txt
          for i in $(seq 1 "$DAYS"); do
            tm=$(TZ=Asia/Seoul date -d "-$i day" +%Y%m%d)
            f="wx_data/daily/$tm.txt"
            if [ "$i" -le 3 ] || [ ! -s "$f" ]; then
              curl -sf --max-time 30 "$BASE/kma_sfcdd.php?tm=$tm&stn=0&disp=0&help=1&authKey=$KMA_KEY" | iconv -f euc-kr -t utf-8 -c | filt > "$f.tmp"
              if grep -qvE '^#|^\s*$' "$f.tmp"; then mv "$f.tmp" "$f"; else rm -f "$f.tmp"; fi
            fi
          done
          ls wx_data/daily | sed 's/\.txt$//' | sort > wx_data/index.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add wx_data
          git diff --cached --quiet || (git commit -m "기상자료 갱신 $(TZ=Asia/Seoul date +%F\ %H:%M)" && git pull --rebase -q && git push -q)
          exit 0
      - name: Clean
        run: rm -rf .github templates tools
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
