name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'   # 매일 10:00(KST) 전일 일자료 갱신
  workflow_dispatch:
    inputs:
      days:
        description: '일자료 받을 기간(일) — 처음 1회는 1095(3년) 권장'
        default: '1095'
      alimi:
        description: '학교알리미 — fetch(자료 갱신) 또는 discover(항목 ID 조사, 최초 1회)'
        default: 'fetch'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch KMA data
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
          DAYS: ${{ github.event.inputs.days || '1095' }}
        run: |
          set +e
          export STN='^(156|165|168|169|170|174|175|260|261|262)$'
          export BASE='https://apihub.kma.go.kr/api/typ01/url'
          mkdir -p wx_data/daily
          # 일자료 — 8개 동시 요청, 50일마다 진행 표시
          fetch(){
            i=$1; tm=$(TZ=Asia/Seoul date -d "-$i day" +%Y%m%d); f="wx_data/daily/$tm.txt"
            if [ "$i" -le 3 ] || [ ! -s "$f" ]; then
              curl -sf --retry 2 --connect-timeout 5 --max-time 15 "$BASE/kma_sfcdd.php?tm=$tm&stn=0&disp=0&help=1&authKey=$KMA_KEY" \
                | iconv -f euc-kr -t utf-8 -c | awk -v re="$STN" '/^#/ || ($2 ~ re)' > "$f.tmp"
              if grep -qvE '^#|^\s*$' "$f.tmp"; then mv "$f.tmp" "$f"; else rm -f "$f.tmp"; fi
            fi
            [ $((i % 50)) -eq 0 ] && echo "진행 $i / $DAYS일 (저장 $(ls wx_data/daily | wc -l)개)"
            return 0
          }
          export -f fetch; export KMA_KEY DAYS
          timeout 35m bash -c 'seq 1 "$DAYS" | xargs -P 8 -I{} bash -c "fetch {}"' || echo "35분 경과 — 받은 만큼 저장합니다. 같은 방법으로 한 번 더 실행하면 나머지를 이어받습니다."
          rm -f wx_data/daily/*.tmp
          echo "일자료 저장: $(ls wx_data/daily | wc -l)개"
          ls wx_data/daily | sed 's/\.txt$//' | sort > wx_data/index.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add wx_data
          git diff --cached --quiet || (git commit -m "기상자료 갱신 $(TZ=Asia/Seoul date +%F\ %H:%M)" && git pull --rebase -q && git push -q)
          exit 0
      - name: Fetch 학교알리미
        if: ${{ github.event_name != 'push' }}
        continue-on-error: true
        env:
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          MODE: ${{ github.event.inputs.alimi || 'fetch' }}
        run: |
          node scripts/alimi_fetch.mjs || echo "학교알리미 스크립트 오류"
          ls -la data || true
          git add data
          git diff --cached --quiet || (git commit -m "학교알리미 자료 갱신" && git pull --rebase && git push)
      - name: 허브·볼트 자동 갱신
        continue-on-error: true
        run: |
          pip install -q beautifulsoup4 markdownify lxml
          python3 tools/build_hub.py      # manuals/ 새 요약문서 → bible.html 카드·manifest.json
          python3 tools/build_vault.py    # 사이트 문서 → vault/ 옵시디언 노트
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bible.html manuals/manifest.json vault
          git diff --cached --quiet || (git commit -m "허브·볼트 자동 갱신" && git pull --rebase && git push)
      - name: 옵시디언 볼트 저장소 동기화 (PC·아이패드용)
        continue-on-error: true
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          # vault/ 노트만 작은 별도 저장소(seum8660/school_bible_vault)로 복사한다.
          # '내 노트'와 .obsidian 설정은 기기에서 쓴 것을 보존한다. 결과는 reports/볼트동기화.txt 에 남긴다.
          set +e
          st="$GITHUB_WORKSPACE/reports/볼트동기화.txt"; mkdir -p "$(dirname "$st")"
          result() { echo "$1" > "$st"; echo "$1"; }
          if [ -z "$VAULT_TOKEN" ]; then result "실패: VAULT_TOKEN 비어 있음"; else
            if ! git clone --depth 1 "https://x-access-token:${VAULT_TOKEN}@github.com/seum8660/school_bible_vault.git" /tmp/v 2>/tmp/clone.err; then
              result "실패: 노트 저장소 접근 불가 — 토큰 권한(Contents 읽기·쓰기, school_bible_vault 선택) 확인 · $(sed "s/${VAULT_TOKEN}/***/g" /tmp/clone.err | tail -1)"
            else
              rsync -a --delete --exclude '.git' --exclude '.obsidian' --exclude '내 노트' vault/ /tmp/v/
              cd /tmp/v
              git config user.name "github-actions"; git config user.email "actions@github.com"
              git add -A
              if git diff --cached --quiet; then result "정상: 변경 없음"
              else
                git commit -qm "치트키 노트 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
                if git push -q origin HEAD:main 2>/tmp/push.err; then result "정상: 노트 갱신 푸시"
                else result "실패: 노트 저장소 푸시 거부 — 토큰에 쓰기 권한 필요 · $(sed "s/${VAULT_TOKEN}/***/g" /tmp/push.err | tail -1)"; fi
              fi
              cd "$GITHUB_WORKSPACE"
            fi
          fi
          git add reports/볼트동기화.txt
          git diff --cached --quiet || (git commit -m "볼트 동기화 상태 기록" && git pull --rebase && git push)
          exit 0
      - name: Clean
        run: rm -rf .github templates tools vault inbox reports
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
