name: 접속 시험 (1회용)
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p reports; o=reports/probe.txt; : > $o
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          echo "=== codil 인증서 체인" >> $o
          echo | timeout 20 openssl s_client -connect www.codil.or.kr:443 -servername www.codil.or.kr -showcerts 2>&1 | grep -E 's:|i:|Verify return|verify error' >> $o
          curl -s -o /dev/null -w 'codil verbose http=%{http_code}\n' --max-time 30 https://www.codil.or.kr/ >> $o 2>&1 || echo "codil curl rc=$?" >> $o
          echo "=== koies 상세 HTML 중 다운로드 관련" >> $o
          curl -sL -A "$UA" --max-time 60 https://www.koies.or.kr/00087/3143 -o /tmp/k.html
          grep -n -iE 'download|fileSn|atchFile|fileId|/file' /tmp/k.html | cut -c1-300 | head -60 >> $o
          for js in $(grep -oE 'src="[^"]*\.js[^"]*"' /tmp/k.html | cut -d'"' -f2 | grep -viE 'jquery|swiper|gsap|lib' | head -8); do
            echo "--- js $js" >> $o
            curl -sL -A "$UA" --max-time 30 "https://www.koies.or.kr$js" | grep -n -iE 'downloadAllFiles|function download|fileDown|/download' | cut -c1-400 | head -15 >> $o
          done
          git config user.name github-actions; git config user.email actions@github.com
          git add $o; git commit -m "접속 시험 결과" && git pull --rebase && git push
