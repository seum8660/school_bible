name: 접속 시험 (1회용)
on:
  push:
    paths: ['.github/workflows/probe.yml', 'tools/fetch_docs.py', 'tools/tests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p reports; o=reports/probe.txt
          python3 tools/fetch_docs.py --dry tools/tests/probe_urls.txt > $o 2>&1
          git config user.name github-actions; git config user.email actions@github.com
          git add $o; git commit -m "접속 시험 결과" && git pull --rebase && git push
