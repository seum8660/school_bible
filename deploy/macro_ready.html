<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>매크로 모음</title>
<style>
  :root{--bg:#f2f4f6;--panel:#fff;--panel2:#f7f9fb;--line:#c4ccd6;--ink:#191f28;--sub:#5d6875;--accent:#1a1d21;--accent-dim:#eceef1;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Malgun Gothic',sans-serif;padding:28px 20px 60px}
  .wrap{max-width:860px;margin:0 auto}
  .hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .ic{width:46px;height:46px;flex:0 0 auto;border-radius:13px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{margin:0;font-size:23px;font-weight:900;letter-spacing:-.7px}
  .sub{font-size:13.5px;color:var(--sub);margin:2px 0 22px 58px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .item{display:flex;align-items:center;gap:13px;text-decoration:none;background:var(--panel);border:1.5px solid var(--line);
        border-radius:14px;padding:15px 17px;color:var(--ink);box-shadow:0 1px 3px rgba(0,27,55,.05);transition:transform .14s,box-shadow .14s}
  .item:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,27,55,.09)}
  .item.soon{opacity:.5;pointer-events:none;filter:grayscale(.4)}
  .no{width:38px;height:38px;flex:0 0 auto;border-radius:11px;background:var(--accent-dim);color:var(--accent);
      display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}
  .tt{flex:1;min-width:0;line-height:1.35}
  .tt b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt span{display:block;font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{flex:0 0 auto;font-size:11px;font-weight:800;padding:4px 11px;border-radius:100px}
  .badge.dl{background:#e8f2ff;color:#1b64da;border:1px solid #b9d3ff}
  .badge.soon{background:#f1f3f5;color:#8b95a1;border:1px solid #dee2e6}
  .note{margin-top:20px;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:12.5px;color:var(--sub);line-height:1.7}
  a.home{display:inline-block;margin-top:22px;text-decoration:none;background:var(--accent);color:#fff;font-weight:800;font-size:13.5px;padding:11px 22px;border-radius:100px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><div class="ic">⚙️</div><h1>매크로 모음</h1></div>
  <div class="sub">설계·적산·공문 작성을 자동화하는 엑셀·한글 매크로</div>

  <div class="grid">
    <a class="item" href="macros/매크로VER1.0.xlsx" download>
      <span class="no">01</span>
      <span class="tt"><b>설계변경내역서</b><span>설계변경 내역·증감 자동 정리 · VER 1.0</span></span>
      <span class="badge dl">다운로드</span>
    </a>
    <a class="item soon" href="#" onclick="return false;">
      <span class="no">02</span>
      <span class="tt"><b>준비 중</b><span>원가계산서 제비율 자동 적용</span></span>
      <span class="badge soon">준비중</span>
    </a>
    <a class="item soon" href="#" onclick="return false;">
      <span class="no">03</span>
      <span class="tt"><b>준비 중</b><span>공사기간 산정·비작업일수 집계</span></span>
      <span class="badge soon">준비중</span>
    </a>
    <a class="item soon" href="#" onclick="return false;">
      <span class="no">04</span>
      <span class="tt"><b>준비 중</b><span>준공정산 조서 자동 작성</span></span>
      <span class="badge soon">준비중</span>
    </a>
  </div>

  <div class="note">💡 매크로 파일은 엑셀에서 열 때 <b>[콘텐츠 사용]</b>을 눌러 매크로를 활성화해야 동작합니다. 실무 참조용이며 최종 결과는 반드시 검토 후 사용하십시오.</div>
  <a class="home" href="index.html">← 치트키로 돌아가기</a>
</div>
</body>
</html>
