<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>워크플로우 대시보드 — 학교시설업무 치트키</title>
<style>
  :root{
    --bg:#f6f5f4; --surface:#ffffff; --surface-2:#f6f5f4;
    --ink:#000000; --ink-2:#31302e; --muted:#615d59; --faint:#a39e98;
    --line:#e6e6e6; --accent:#0075de; --accent-soft:#e7f1fc; --radsm:8px;
  }
  [data-theme="dark"]{
    --bg:#191919; --surface:#252525; --surface-2:#202020;
    --ink:#f5f4f2; --ink-2:#d8d5d1; --muted:#a39e98; --faint:#7c7772;
    --line:#373737; --accent:#529cff; --accent-soft:rgba(82,156,255,.18);
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{padding:18px 22px 0;max-width:1400px;width:100%;margin:0 auto}
  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .sub{font-size:13px;color:var(--muted)}
  .tools{margin-left:auto;display:flex;gap:8px}
  .tools button,.tools a{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radsm);
    padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .tools button:hover,.tools a:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
  .wf-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 12px}
  .wf-pick{display:flex;align-items:center;gap:10px;font:inherit;text-align:left;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radsm);padding:11px 15px;color:var(--ink)}
  .wf-pick:hover{border-color:var(--accent)}
  .wf-pick.on{border-color:var(--accent);background:var(--accent-soft)}
  .wf-pick.on .wf-ic{background:var(--accent);color:#fff}
  .wf-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;
    background:var(--surface-2);flex:0 0 auto;color:var(--ink-2)}
  .wf-nm{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em}
  .wf-dc{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
  .src{font-size:11.5px;color:var(--faint);line-height:1.6;margin:0 0 12px}
  main{flex:1;min-height:1000px;max-width:1400px;width:100%;margin:0 auto;padding:0 22px 22px}
  .frame{height:100%;min-height:1000px;border:1px solid var(--line);border-radius:var(--radsm);overflow:hidden;background:var(--surface)}
  iframe{display:block;width:100%;height:100%;border:0}
  @media(max-width:1000px){.wf-picker{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:640px){.wf-picker{grid-template-columns:1fr}header,main{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>워크플로우 대시보드</h1>
    <span class="sub">사전기획 · 설계 · 발주 · 착공 · 시공관리 · 준공검사 · 사용승인</span>
    <div class="tools">
      <button type="button" id="themeBtn" title="다크 모드 전환">◐ 테마</button>
      <a href="#" id="openNew" target="_blank" rel="noopener noreferrer">새 창 ↗</a>
      <a href="bible.html">← 치트키</a>
    </div>
  </div>

  <div class="wf-picker" id="picker">
    <button type="button" class="wf-pick on" data-src="워크플로우_전주기_대시보드.html">
      <span class="wf-ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h4l2-6 3 12 2.5-8 1.5 2h4"/></svg></span>
      <span><span class="wf-nm">기획부터 준공까지 (전주기)</span><span class="wf-dc">학교시설 사업 전체 흐름</span></span>
    </button>
    <button type="button" class="wf-pick" data-src="워크플로우_설계변경_대시보드.html">
      <span class="wf-ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M4 12h6M4 17h11"/><path d="M15 6l4 3-4 3"/></svg></span>
      <span><span class="wf-nm">설계변경 · 계약금액 조정</span><span class="wf-dc">지방계약법 시행령 제73조 · 제74조</span></span>
    </button>
    <button type="button" class="wf-pick" data-src="워크플로우_공기연장_대시보드.html">
      <span class="wf-ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
      <span><span class="wf-nm">공기연장 · 간접비 정산</span><span class="wf-dc">지방계약법 시행령 제75조</span></span>
    </button>
    <button type="button" class="wf-pick" data-src="워크플로우_감리방식_대시보드.html">
      <span class="wf-ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v6"/><path d="M12 10 6.5 20M12 10l5.5 10"/><circle cx="12" cy="4" r="1.6"/></svg></span>
      <span><span class="wf-nm">감리 · 건설사업관리 방식 결정</span><span class="wf-dc">건설기술진흥법 제39조의2</span></span>
    </button>
    <button type="button" class="wf-pick" data-src="워크플로우_안전사고_대시보드.html">
      <span class="wf-ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2 20 18.5H4z"/><path d="M12 10v3.4M12 16.2h.01"/></svg></span>
      <span><span class="wf-nm">공사 중 안전사고 대응</span><span class="wf-dc">산업안전보건법 제54조 · 제55조</span></span>
    </button>
    <button type="button" class="wf-pick" data-src="워크플로우_인허가_대시보드.html">
      <span class="wf-ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8L18.5 8v12.5H6z"/><path d="M13.5 3.5V8h5"/><path d="M9 13.5l2 2 4-4"/></svg></span>
      <span><span class="wf-nm">학교시설 인허가</span><span class="wf-dc">학교시설사업 촉진법 제4조</span></span>
    </button>
    <button type="button" class="wf-pick" data-src="워크플로우_엔지니어링평가_대시보드.html">
      <span class="wf-ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V10M9.5 19.5V6M15 19.5v-7M20.5 19.5V3.5"/></svg></span>
      <span><span class="wf-nm">건설엔지니어링 및 시공 평가</span><span class="wf-dc">건설기술진흥법 제50조</span></span>
    </button>
    <button type="button" class="wf-pick" data-src="워크플로우_도시계획_대시보드.html">
      <span class="wf-ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4.5v13M15 7.5v13"/></svg></span>
      <span><span class="wf-nm">도시·군관리계획 결정</span><span class="wf-dc">국토계획법 제24조~제32조</span></span>
    </button>
    <button type="button" class="wf-pick" data-src="워크플로우_환경영향평가_대시보드.html">
      <span class="wf-ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5c5-2.5 7-6.5 7-11.5-3.5 0-6 .8-7 2.5C11 9.8 8.5 9 5 9c0 5 2 9 7 11.5z"/><path d="M12 20.5V11"/></svg></span>
      <span><span class="wf-nm">환경영향평가 협의</span><span class="wf-dc">환경영향평가법 제22조~제36조</span></span>
    </button>
  </div>

  <div class="src">※ 출처 — 「도시·군관리계획 결정」·「환경영향평가 협의」 보드는 <a href="https://hosungseo.github.io/korea100/" target="_blank" rel="noopener noreferrer">대한민국 제도 지도(korea100)</a>의 공개 자료(<a href="https://opensource.org/licenses/MIT" target="_blank" rel="noopener noreferrer">MIT License</a>)를 참고해 재구성했습니다. 그 밖의 보드는 관련 법령·지침 및 국토안전관리원 업무절차 설명서를 근거로 작성했습니다.</div>
</header>

<main>
  <div class="frame"><iframe id="wfFrame" src="워크플로우_전주기_대시보드.html" title="워크플로우"></iframe></div>
</main>

<script>
(function(){
  var frame=document.getElementById('wfFrame'), openNew=document.getElementById('openNew');
  function setSrc(src,name){ if(frame.getAttribute('src')!==src) frame.setAttribute('src',src);
    frame.title=name; openNew.href=src; }
  var first=document.querySelector('.wf-pick.on');
  setSrc(first.dataset.src, first.querySelector('.wf-nm').textContent);

  document.getElementById('picker').addEventListener('click',function(e){
    var b=e.target.closest('.wf-pick'); if(!b) return;
    document.querySelectorAll('.wf-pick').forEach(function(x){x.classList.toggle('on',x===b);});
    setSrc(b.dataset.src, b.querySelector('.wf-nm').textContent);
    try{localStorage.setItem('wfDashPick',b.dataset.src);}catch(_){}
  });

  try{
    var saved=localStorage.getItem('wfDashPick');
    if(saved){ var t=document.querySelector('.wf-pick[data-src="'+saved+'"]'); if(t) t.click(); }
    var th=localStorage.getItem('wfDashTheme');
    if(th) document.documentElement.dataset.theme=th;
    else if(matchMedia('(prefers-color-scheme:dark)').matches) document.documentElement.dataset.theme='dark';
  }catch(_){}

  document.getElementById('themeBtn').addEventListener('click',function(){
    var n=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=n;
    try{localStorage.setItem('wfDashTheme',n);}catch(_){}
  });
})();
</script>
</body>
</html>
