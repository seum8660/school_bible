<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>질의회신 검색 · 국토교통부 자주찾는민원 · 국민신문고</title>
<meta name="description" content="국토교통부 자주찾는민원 질의회신 11,821건과 국민신문고 공사계약·시설 분야 답변원문 3,225건을 검색하고 원문을 확인합니다.">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --nav:#1C3454; --nav2:#24456C; --nav3:#325A88;
  --rust:#B45309; --rust-bg:#FFFBF4;
  --paper:#F4F6F9; --card:#FFFFFF; --line:#DFE4EB;
  --muted:#6B7480; --ink:#1E232A;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.7; color:var(--ink); background:var(--paper);
  display:flex; height:100vh; overflow:hidden;
}
button{font-family:inherit}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--rust); outline-offset:2px}

/* ── 좌측 ── */
#side{width:236px;flex-shrink:0;background:var(--nav);color:#DCE4EE;display:flex;flex-direction:column;transition:transform .18s}
.brand{padding:20px 18px 16px}
.brand b{display:block;font-size:16px;color:#fff;font-weight:700;letter-spacing:-.3px}
.brand span{font-size:11.5px;color:#8CA3C0}
.newbtn{display:flex;align-items:center;gap:9px;width:calc(100% - 28px);margin:4px 14px 6px;padding:10px 12px;
  background:#2A4F79;color:#fff;border:1px solid #3D6796;border-radius:6px;font-size:13.5px;cursor:pointer;text-align:left}
.newbtn:hover{background:#33608F}
.dot{width:14px;height:14px;border-radius:50%;background:var(--rust);flex-shrink:0}
.histlabel{padding:14px 18px 6px;font-size:11.5px;color:#7B92AF}
#hist{flex:1;overflow-y:auto;padding:0 8px 12px}
.hitem{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;color:#C3D0E1;text-align:left;
  padding:8px 10px;border-radius:5px;font-size:13px;cursor:pointer;line-height:1.45}
.hitem:hover{background:#2A4F79;color:#fff}
.hitem.on{background:#33608F;color:#fff}
.htxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdel{background:none;border:none;color:#7B92AF;cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;border-radius:3px}
.hdel:hover{color:#fff;background:#3D6796}
.hempty{padding:8px 10px;font-size:12.5px;color:#6C84A2}
.sidefoot{padding:12px 18px 16px;border-top:1px solid #2E5079;font-size:12px;color:#8CA3C0;line-height:1.6}
.srcnote{margin-top:8px;padding-top:8px;border-top:1px solid #2E5079;font-size:11px;color:#7B92AF}

/* ── 중앙 ── */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:11px 22px;background:var(--card);border-bottom:1px solid var(--line)}
#bar h1{margin:0;font-size:14.5px;font-weight:700;color:var(--nav);letter-spacing:-.2px}
.meta{font-size:12px;color:var(--muted);margin-left:auto}
.toggle{display:none;background:none;border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-size:12.5px;color:var(--nav);cursor:pointer}
#scroll{flex:1;overflow-y:auto}
.inner{max-width:790px;margin:0 auto;padding:24px 24px 30px}

.intro h2{font-size:21px;font-weight:700;color:var(--nav);margin:0 0 10px;letter-spacing:-.3px}
.intro p{margin:0 0 18px;color:var(--muted);max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tag{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 15px;font-size:13.5px;color:var(--nav);cursor:pointer}
.tag:hover{border-color:var(--nav2);background:#EFF3F8}

#filter{padding:0 2px 10px}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.flabel{font-size:12px;font-weight:600;color:var(--nav);flex-shrink:0}
.fstate{font-size:11.5px;color:var(--muted)}
.fclear{margin-left:auto;background:none;border:none;font-size:11.5px;color:var(--nav2);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0 2px;flex-shrink:0}
.fclear:hover{color:var(--rust)}
.fchips{display:flex;flex-wrap:wrap;gap:5px}
.fchip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;font-size:13px;color:#39424E;cursor:pointer;line-height:1.4}
.fchip:hover{border-color:var(--nav2);color:var(--nav)}
.fchip.on{background:var(--nav);border-color:var(--nav);color:#fff;font-weight:600}
.fchip .fn{font-size:11px;color:#98A2AE;font-variant-numeric:tabular-nums}
.fchip.on .fn{color:#C2D2E6}
.fmore{background:none;border:1px dashed var(--line);border-radius:6px;padding:5px 10px;
  font-size:12.5px;color:var(--muted);cursor:pointer}
.fmore:hover{border-color:var(--nav2);color:var(--nav)}
.chiprow{display:flex;justify-content:flex-end;margin-bottom:18px}
.chip{background:#DCE6F2;color:#1B3A5E;border-radius:18px;padding:8px 16px;max-width:80%;font-size:13.5px;white-space:pre-wrap}
.count{font-size:13px;color:var(--muted);margin:0 0 12px}
.note{background:var(--rust-bg);border:1px solid #EBD8BC;border-radius:7px;padding:11px 14px;font-size:13.5px;color:#6B4A17;margin-bottom:14px;line-height:1.65}

.results{display:grid;gap:12px}
.rescard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:15px 17px}
.rescard.on{border-color:var(--nav2);box-shadow:0 0 0 1px var(--nav2) inset}
.resline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.badge{background:var(--nav);color:#fff;border-radius:4px;padding:3px 9px;font-size:11.5px;font-weight:500;flex-shrink:0}
.restitle{background:none;border:none;padding:0;font-size:14.5px;font-weight:700;color:var(--nav2);cursor:pointer;text-align:left;line-height:1.5}
.restitle:hover{text-decoration:underline;text-underline-offset:3px}
.orig{margin-top:12px}
.orig h4{margin:0 0 5px;font-size:11.5px;color:var(--muted);font-weight:500}
.raw{font-size:13.5px;line-height:1.8;color:#2C333C;white-space:pre-wrap;word-break:break-word;
  background:#FAFBFC;border:1px solid #EDF0F4;border-radius:6px;padding:11px 13px}
.field{margin-top:9px;font-size:13.5px;line-height:1.75;color:#333A44}
.field b{color:var(--nav);font-weight:700}
.more{margin-top:11px;background:none;border:1px solid var(--line);border-radius:5px;padding:5px 11px;font-size:12.5px;color:var(--nav);cursor:pointer}
.more:hover{border-color:var(--nav)}

/* 의견 */
.op{margin-top:22px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rust);
  border-radius:0 9px 9px 0;padding:16px 18px 14px}
.ophead{font-size:12.5px;font-weight:700;color:var(--rust);margin-bottom:8px}
.optitle{font-size:15px;font-weight:700;color:var(--nav);margin-bottom:8px}
.optext{font-size:14.5px;line-height:1.8;white-space:pre-wrap;color:#242A32}
.cite{color:var(--nav2);font-weight:600;background:none;border:none;padding:0;font-size:inherit;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.cite:hover{color:var(--rust)}
.refs{margin-top:14px;display:grid;gap:5px}
.refslabel{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.ref{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:#F7F9FC;border:1px solid #E3E8EF;
  border-radius:6px;padding:7px 11px;font-size:12.5px;color:var(--ink);cursor:pointer;line-height:1.55}
.ref:hover{background:#EDF2F8;border-color:var(--nav2)}
.refno{color:var(--nav2);font-weight:700;flex-shrink:0}
.reftitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refmeta{color:var(--muted);font-size:11.5px;flex-shrink:0}
.opfoot{margin-top:11px;padding-top:10px;border-top:1px solid #F0F1F3;font-size:11.5px;color:var(--muted);line-height:1.6}
.nothem{margin-top:22px;background:#F7F8FA;border:1px solid var(--line);border-radius:8px;padding:14px 16px;
  font-size:13.5px;color:var(--muted);line-height:1.7}

/* 입력 */
#foot{padding:6px 24px 18px}
.footin{max-width:790px;margin:0 auto}
.inputwrap{display:flex;align-items:flex-end;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:26px;padding:7px 8px 7px 20px}
.inputwrap:focus-within{border-color:var(--nav2);box-shadow:0 0 0 3px rgba(36,69,108,.12)}
#q{flex:1;resize:none;border:none;background:none;padding:8px 0;font-family:inherit;font-size:14.5px;
  line-height:1.6;color:var(--ink);max-height:120px}
#q:focus{outline:none}
#send{width:38px;height:38px;border-radius:50%;border:none;background:var(--nav2);color:#fff;font-size:17px;
  cursor:pointer;flex-shrink:0;line-height:1}
#send:hover{background:var(--nav3)}
#send:disabled{background:#B6C0CC;cursor:default}
.disc{font-size:11.5px;color:var(--muted);margin:9px 4px 0;line-height:1.6}

/* 우측 */
#panel{width:380px;flex-shrink:0;padding:16px 16px 16px 4px;display:flex;transition:transform .18s}
.pcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.phead{padding:14px 18px 11px;display:flex;align-items:baseline;gap:8px;font-size:14.5px;font-weight:700;
  color:var(--nav);border-bottom:1px solid #EDF0F4}
.phead span{margin-left:auto;font-weight:400;font-size:11px;color:var(--muted)}
.pclose{display:none;background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
.pbody{flex:1;overflow-y:auto;padding:15px 18px 22px}
.pempty{color:var(--muted);font-size:13px;line-height:1.7}
.pno{font-size:11.5px;color:var(--nav2);font-weight:700}
.ptitle{font-size:14px;font-weight:700;color:var(--nav);margin-top:3px;line-height:1.55}
.pmeta{font-size:12px;color:var(--muted);margin-top:6px;padding-bottom:12px;border-bottom:1px solid #EDF0F4}
.psec{margin-top:14px}
.psec h4{margin:0 0 5px;font-size:11.5px;color:var(--muted);font-weight:500}
.psec div{font-size:13px;color:#3B4149;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.copy{margin-top:16px;background:none;border:1px solid var(--line);border-radius:5px;padding:6px 12px;
  font-size:12.5px;color:var(--nav);cursor:pointer}
.copy:hover{border-color:var(--nav)}

/* AI 검토 */
.rvintro{font-size:13px;color:var(--muted);line-height:1.75}
.rvq{font-size:13px;font-weight:700;color:var(--nav);background:#F4F7FB;border:1px solid #E3E8EF;border-radius:8px;padding:9px 12px;margin:0 0 12px;line-height:1.55}
.rvbtn{display:block;width:100%;margin-top:12px;background:var(--nav2);color:#fff;border:none;border-radius:8px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer}
.rvbtn:hover{background:#0B50D0}
.rvbtn:disabled{background:#CDD1D5;cursor:default}
.rvacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid #EDF0F4}
.rvact{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:12.5px;color:var(--nav);cursor:pointer}
.rvact:hover{border-color:var(--nav2);color:#0B50D0}
.rvact.pri{background:var(--nav2);border-color:var(--nav2);color:#fff;font-weight:700}
.rvact.pri:hover{background:#0B50D0}
.rvtext{font-size:13.5px;line-height:1.8;color:#242A32;white-space:pre-wrap;word-break:break-word}
.rvtext h5{margin:14px 0 4px;font-size:13px;color:#0B50D0;font-weight:700}
.rvtext h5:first-child{margin-top:0}
.rvmode{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;margin-bottom:10px;background:#ECF2FE;color:#0B50D0}
.rvmode.off{background:#F1F2F3;color:#6D7882}
.rvfoot{margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.6}
.spin{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:14px}
.spin i{width:16px;height:16px;border:2px solid #D8E5FD;border-top-color:#256EF4;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#docm{display:none;position:fixed;inset:0;z-index:50;background:rgba(15,25,40,.45);align-items:center;justify-content:center;padding:24px}
#docm.open{display:flex}
.dmbox{background:#fff;border-radius:12px;width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(20,30,45,.25)}
.dmhead{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid #EDF0F4;font-size:14px;font-weight:700;color:var(--nav)}
.dmhead button{margin-left:auto;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.dmbody{overflow-y:auto;padding:16px 20px 22px}

#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  background:var(--paper);z-index:60;color:var(--muted);font-size:14px;text-align:center;padding:24px}
#boot b{color:var(--nav);font-size:16px}
#scrim{display:none;position:fixed;inset:0;background:rgba(15,25,40,.4);z-index:28}

@media (max-width:1120px){
  #panel{position:fixed;top:0;right:0;height:100%;width:348px;z-index:30;padding:12px;transform:translateX(105%)}
  #panel.open{transform:translateX(0)}
  .pcard{box-shadow:-6px 0 24px rgba(20,30,45,.16)}
  .pclose{display:block}
  .toggle{display:inline-block}
}
@media (max-width:820px){
  #side{position:fixed;top:0;left:0;height:100%;z-index:32;transform:translateX(-100%)}
  #side.open{transform:translateX(0)}
  #scrim.open{display:block}
  .inner,#foot{padding-left:16px;padding-right:16px}
  #bar{padding-left:16px;padding-right:16px}
  .ref{flex-wrap:wrap}
  .reftitle{white-space:normal;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 결과 목록(제목 줄) */
.results{gap:8px}
.rescard.row{padding:0;overflow:hidden}
.rowhead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;text-align:left;
  padding:12px 16px;cursor:pointer;font-family:inherit;color:var(--ink)}
.rowhead:hover{background:#F7F9FC}
.caret{flex-shrink:0;width:12px;color:var(--muted);font-size:12px}
.rowtitle{flex:1;min-width:0;font-size:14.5px;font-weight:700;color:var(--nav2);line-height:1.5}
.rowmeta{flex-shrink:0;font-size:12px;color:var(--muted);white-space:nowrap}
.rowbody{padding:0 16px 14px 38px;border-top:1px solid #EDF0F4}
@media (max-width:820px){.rowhead{flex-wrap:wrap}.rowtitle{flex-basis:100%;order:3}.rowbody{padding-left:16px}}
</style>
<style id="gov24-theme">
/* ===== 정부24(KRDS) 디자인 ===== */

<body>

<div id="boot"><b>회신 자료를 여는 중입니다</b><span id="bootmsg">1만5천여 건을 불러옵니다. 잠시만 기다려 주십시오.</span></div>

<aside id="side">
  <div class="brand"><b>질의회신 검색</b><span id="brandsub"></span></div>
  <button class="newbtn" id="newbtn"><span class="dot"></span>새 검색</button>
  <div class="histlabel">질의이력</div>
  <div id="hist"></div>
  <div class="sidefoot" id="sidefoot"></div>
</aside>
<div id="scrim"></div>

<main id="main">
  <div id="bar">
    <button class="toggle" id="tside">이력</button>
    <h1>질의회신 검색</h1>
    <span class="meta" id="barmeta"></span>
    <button class="toggle" id="tpanel">검토</button>
  </div>
  <div id="scroll"><div class="inner" id="content"></div></div>
  <div id="foot"><div class="footin">
    <div id="filter"></div>
    <div class="inputwrap">
      <textarea id="q" rows="1" placeholder="찾으시는 내용을 입력해 주십시오 (예) '설계변경 단가 적용', '안전관리계획 대상'"></textarea>
      <button id="send" aria-label="검색" disabled>↑</button>
    </div>
    <p class="disc" id="disc"></p>
  </div></div>
</main>

<aside id="panel"><div class="pcard">
  <div class="phead">검색 관련 목록 <span id="psrc"></span><button class="pclose" id="pclose" aria-label="닫기">×</button></div>
  <div class="pbody" id="rvbody"></div>
</div></aside>
<div id="docm"><div class="dmbox">
  <div class="dmhead">회신 원문<button id="dmclose" aria-label="닫기">×</button></div>
  <div class="dmbody" id="pbody"></div>
</div></div>

<script>
const SOURCE_NAME = "국토교통부 자주찾는민원";
const FETCHED_AT  = "2026. 9. 14.";

/* ───────── 자료 읽기 ───────── */
async function unpack(buf){
  const bytes = new Uint8Array(buf);
  const isGzip = bytes.length>2 && bytes[0]===0x1f && bytes[1]===0x8b;
  if (!isGzip) return new TextDecoder("utf-8").decode(bytes);
  if (typeof DecompressionStream === "undefined")
    throw new Error("이 브라우저에서는 자료를 풀 수 없습니다. 크롬이나 엣지 최신 버전으로 열어 주십시오.");
  const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(st).text();
}

async function boot(){
  try{
    const [buf, ops] = await Promise.all([
      (async()=>{ for(const n of ["data.bin","data.json.gz","data.gz"]){ try{ const r=await fetch(n); if(r.ok) return r.arrayBuffer(); }catch(e){} }
        throw new Error("data.bin 을 찾지 못했습니다. 같은 폴더에 있는지 확인해 주십시오."); })(),
      fetch("opinions.json").then(r=>r.ok ? r.json() : [])
    ]);

    const bytes = new Uint8Array(buf);
    const isGzip = bytes.length>2 && bytes[0]===0x1f && bytes[1]===0x8b;
    let text;
    if (isGzip){
      // 서버가 그대로 보낸 경우 직접 해제한다
      if (typeof DecompressionStream === "undefined")
        throw new Error("이 브라우저에서는 자료를 풀 수 없습니다. 크롬이나 엣지 최신 버전으로 열어 주십시오.");
      const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      text = await new Response(st).text();
    } else {
      // 서버가 이미 풀어 보낸 경우 그대로 읽는다
      text = new TextDecoder("utf-8").decode(bytes);
    }

    DOCS = JSON.parse(text).map(r=>({no:r[0],title:r[1],cat:r[2],org:r[3],dept:r[4],date:r[5],q:r[6],a:r[7]}));
    // 국민신문고 자료는 없어도 기존 검색은 그대로 동작한다
    try{
      const r=await fetch("epeople.bin");
      if(r.ok){
        const ep=JSON.parse(await unpack(await r.arrayBuffer()));
        DOCS = DOCS.concat(ep.map(r=>({no:r[0],title:r[1],cat:r[2]||EP_CAT,org:r[3],dept:r[4],date:r[5],q:r[6],a:r[7]})));
      }
    }catch(e){}
    DOCS.forEach(d=>{ if(!BYNO.has(d.no)) BYNO.set(d.no,d); });
    OPINIONS = ops;
    const cnt = new Map();
    for(const d of DOCS){ const c=d.cat||"미분류"; cnt.set(c,(cnt.get(c)||0)+1); }
    CATS = [...cnt.entries()].sort((a,b)=>b[1]-a[1]);
    try{ const sv=JSON.parse(localStorage.getItem("molitqa:cats")); if(Array.isArray(sv)) selected=new Set(sv); }catch(e){}
    history = loadHistory();
    document.getElementById("boot").style.display="none";
    render();
    // 치트키 전체 검색에서 넘어온 검색어(?q=)가 있으면 바로 찾는다
    try{ const pq=new URLSearchParams(location.search).get("q"); if(pq&&pq.trim()) run(pq.trim()); }catch(e){}
  }catch(e){
    document.getElementById("boot").innerHTML =
      "<b>자료를 열지 못했습니다</b><span>"+e.message+"</span>";
  }
}

/* ───────── 검색 ───────── */
const tokenize = t => String(t||"").toLowerCase().replace(/[^0-9a-z가-힣]+/g," ").split(" ").filter(x=>x.length>=2);
// 검색어 동의어 — 제목에 그대로 쓰이지 않는 말도 찾도록 대체어(alt)를 더하고,
// 같은 제목이 섞일 때 본문에 근거 법령(boost)이 있는 회신을 위로 올린다
const SYNONYMS = {
  "건설안전관리비": {alt:["건진법안전관리비","안전관리비"], boost:["건설기술 진흥법","건설기술진흥법","건진법","별표7","별표 7","제63조","제60조"]},
  "건진법안전관리비": {alt:["안전관리비"], boost:["건설기술 진흥법","건설기술진흥법","건진법","별표7","별표 7","제63조","제60조"]},
  "산안비": {alt:["산업안전보건관리비","안전보건관리비"], boost:["산업안전보건법","산업안전보건관리비 계상"]},
  "건진법": {alt:["건설기술 진흥법","건설기술진흥법"], boost:[]},
  "에스컬레이션": {alt:["물가변동"], boost:[]},
  "esc": {alt:["물가변동"], boost:[]},
  "선급금": {alt:["선금"], boost:[]}
};
const variants = t => {
  const base = /[가-힣]/.test(t)&&t.length>=3 ? [t,t.slice(0,-1)] : [t];
  const sy = SYNONYMS[t];
  return sy ? [...base, ...sy.alt] : base;
};

function searchDocs(query){
  const tokens=[...new Set(tokenize(query))];
  if(!tokens.length) return [];
  const out=[];
  for(const d of DOCS){
    if(selected.size && !selected.has(d.cat||"미분류")) continue;
    const title=d.title.toLowerCase();
    const body=(d.q+" "+d.a+" "+d.cat).toLowerCase();
    let score=0, hit=0;
    for(const t of tokens){
      let m=false;
      for(const v of variants(t)) if(title.includes(v)){score+=6;m=true;break;}
      if(!m) for(const v of variants(t)) if(body.includes(v)){score+=2;m=true;break;}
      if(m) hit++;
    }
    if(score>0){
      for(const t of tokens){ const sy=SYNONYMS[t]; if(sy&&sy.boost.some(k=>body.includes(k.toLowerCase()))) score+=3; }
      out.push({d,s:score*Math.pow(hit/tokens.length,1.5)});
    }
  }
  // 점수가 같으면 최근 회신을 먼저 보여 준다 (회신일자 YYYY.MM.DD 문자열 비교)
  const dk = d => String(d.date||"").replace(/[^0-9]/g,"").padEnd(8,"0");
  out.sort((a,b)=> (b.s-a.s) || (dk(b.d) < dk(a.d) ? -1 : dk(b.d) > dk(a.d) ? 1 : 0));
  LAST_TOTAL = out.length;
  return out.slice(0,TOP_K).map(x=>x.d);
}

function matchTheme(query){
  const q=String(query||"").toLowerCase().replace(/\s+/g,"");
  let best=null,bs=0;
  for(const t of OPINIONS){
    let s=0;
    for(const k of t.keywords){
      const kk=k.toLowerCase().replace(/\s+/g,"");
      if(kk.length>=2 && q.includes(kk)) s+=kk.length;
    }
    if(s>bs){bs=s;best=t;}
  }
  return bs>=2?best:null;
}

function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY))||[] }catch{ return [] } }
function saveHistory(){ try{ localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(0,80))) }catch(e){} }

/* ───────── 실행 ───────── */
function run(text){
  const query=(text ?? document.getElementById("q").value).trim();
  if(!query) return;
  document.getElementById("q").value="";
  document.getElementById("send").disabled=true;
  openDoc=null; closePanel(); closeSide();

  EXPANDED.clear();
  const hits=searchDocs(query);
  const theme=matchTheme(query);
  current={
    id:"q"+Date.now()+Math.random().toString(36).slice(2,6),
    query, at:Date.now(),
    hits:hits.map(d=>d.no), total:LAST_TOTAL,
    themeId:theme?theme.id:null,
    cats:[...selected],
    note:hits.length?"":(selected.size
      ? "선택하신 "+[...selected].join("·")+" 분야에서는 맞는 회신을 찾지 못했습니다. 분야를 넓히거나 용어를 바꿔 보십시오."
      : "검색어와 겹치는 낱말이 회신에 없습니다. 법령명이나 용어를 바꿔 다시 찾아 보십시오.")
  };
  history.unshift(current); saveHistory();
  render();
  document.getElementById("scroll").scrollTop=0;
}

const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const source = d => [d.org,d.dept].filter(Boolean).join(" ") || "담당부서 미기재";

function withCites(text){
  return esc(text).split(/(\[#E?\d+\])/g).map(p=>{
    const m=/^\[#(E?\d+)\]$/.exec(p);
    return m ? '<button class="cite" data-no="'+m[1]+'">'+p+'</button>' : p;
  }).join("");
}

/* ───────── AI 검토의견 ───────── */
const hasAI = () => !!(window.claude && window.claude.complete);
let reviewing = false;
const cut = (s,n) => { s=String(s||"").replace(/\s+/g," ").trim(); return s.length>n ? s.slice(0,n)+"…" : s; };
const hitDocs = () => (current?.hits||[]).map(n=>BYNO.get(n)).filter(Boolean);
const gist = d => { const s=String(d.a||"").replace(/\s+/g," ").trim(); const m=s.match(/^.{20,220}?(다\.|니다\.|바랍니다\.)/); return m?m[0]:cut(s,200); };

const ONE_KEY="molitqa:rv1:";
const oneBusy=new Set();
function paintOne(no,html){ document.querySelectorAll('[data-rvfor="'+no+'"]').forEach(el=>el.innerHTML=html); }
async function oneReview(d,force){
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(ONE_KEY+d.no)); }catch(e){}
  const show=r=>paintOne(d.no,'<span class="rvmode'+(r.mode==="ai"?"":" off")+'">'+(r.mode==="ai"?"AI 검토":"자동 요약")+'</span>'+
    '<div class="rvtext">'+fmtReview(r.text)+'</div>'+
    (hasAI()?'<div style="margin-top:8px"><button class="rvact" data-one="'+esc(d.no)+'">다시 검토</button></div>':""));
  if(cached&&!force&&(cached.mode==="ai"||!hasAI())){ show(cached); return; }
  if(!hasAI()){ const r={mode:"auto",text:"【요지】\n"+gist(d)+"\n\n【유의사항】\n- 회신 본문 첫 문장을 뽑은 요약입니다. 원문을 확인하십시오.\n- 회신일자("+(d.date||"미기재")+") 이후 법령 개정 여부를 확인하십시오."}; show(r); return; }
  if(oneBusy.has(d.no)) { paintOne(d.no,'<div class="spin" style="margin-top:4px"><i></i>이 회신을 검토하고 있습니다…</div>'); return; }
  oneBusy.add(d.no);
  paintOne(d.no,'<div class="spin" style="margin-top:4px"><i></i>이 회신을 검토하고 있습니다…</div>');
  const body={max_tokens:1200,
    system:"당신은 학교시설 업무(건축·건설·계약·안전) 담당 공무원을 돕는 검토 보조자입니다. 제공된 국토교통부 질의회신 1건만 근거로 검토의견을 씁니다. 회신에 없는 내용은 추측하지 않습니다. 공문체(~함, ~임)로 간결하게 쓰고 마크다운 기호(#, *, |)는 쓰지 않습니다.",
    messages:[{role:"user",content:"제목: "+d.title+"\n회신일자: "+(d.date||"미기재")+" / 소관: "+source(d)+"\n분야: "+(d.cat||"-")+"\n\n질의:\n"+cut(d.q,1500)+"\n\n회신:\n"+cut(d.a,2500)+
      "\n\n아래 형식 그대로 작성하십시오. 제목은 【】로 감쌉니다.\n【요지】 질의 쟁점과 회신 결론을 2문장으로\n【판단 근거】 회신이 든 법령·조문과 논리를 '- '로\n【학교시설 적용】 학교 공사·용역 실무에 적용할 점 2~3개 '- '로\n【유의사항】 적용 한계, 회신일자 이후 법령 개정 확인 필요 사항 등 '- '로"}]};
  let text=null;
  try{ text=await window.claude.complete({...body,model:"claude-sonnet-4-5"}); }
  catch(e){ try{ text=await window.claude.complete(body); }catch(e2){} }
  oneBusy.delete(d.no);
  if(!text){ paintOne(d.no,'<div class="rvintro">검토의견을 만들지 못했습니다. 잠시 후 <button class="rvact" data-one="'+esc(d.no)+'">다시 시도</button></div>'); return; }
  const r={mode:"ai",text,at:Date.now()};
  try{ localStorage.setItem(ONE_KEY+d.no,JSON.stringify(r)); }catch(e){}
  show(r);
}

function fmtReview(t){
  return withCites(t).replace(/【([^】]+)】\s*/g,(m,h)=>"<h5>"+h+"</h5>");
}

const focusDoc = () => { if(!current) return null; const hs=current.hits||[]; const no=(current.focus&&hs.includes(current.focus))?current.focus:hs[0]; return no?BYNO.get(no):null; };
const oneCache = no => { try{ return JSON.parse(localStorage.getItem(ONE_KEY+no)); }catch(e){ return null; } };

function renderReview(){
  const b=document.getElementById("rvbody"); if(!b) return;
  if(!current){
    b.innerHTML='<div class="rvintro">검색하시면 맞는 회신 목록이 여기에 관련도 순으로 표시됩니다.<br><br>· 목록에서 회신을 누르면 본문 하단의 AI 검토의견이 그 회신으로 바뀝니다.<br>· 검토의견은 한 장 검토서(A4)로 인쇄할 수 있습니다.'+
      (hasAI()?"":"<br><br>현재 AI가 연결되지 않은 환경이라 회신 요지를 자동으로 뽑아 정리합니다.")+"</div>";
    return;
  }
  const d=focusDoc();
  b.innerHTML='<div class="rvq">'+esc(current.query)+'</div>'+(d?relList(d):'<div class="rvintro">찾은 회신이 없습니다.</div>');
}

function reviewBlock(d){
  return '<div class="op" id="rvblock"><div class="ophead">AI 검토의견 · 회신 1건</div>'+
    '<div class="optitle"><span style="color:#0B50D0">#'+esc(d.no)+'</span> '+esc(d.title)+
      '<div style="font-weight:400;font-size:12px;color:#6D7882;margin-top:3px">'+esc(source(d))+' · 회신일자 '+esc(d.date||"미기재")+(d.cat?' · '+esc(d.cat):'')+'</div></div>'+
    '<div data-rvfor="'+esc(d.no)+'"></div>'+
    '<div class="rvacts"><button class="rvact pri" data-rv="sheet">한 장 검토서</button>'+
      '<button class="rvact" data-rv="copy">복사</button><button class="rvact" data-no="'+esc(d.no)+'">원문 보기</button></div>'+
    '<div class="opfoot">'+SOURCE_NAME+" "+FETCHED_AT+" 조회본 회신 1건만을 근거로 한 참고 의견이며 유권해석이 아닙니다. 다른 회신을 검토하려면 오른쪽 목록이나 결과 카드의 AI 검토를 누르십시오.</div></div>";
}

function relList(fd){
  const hs=hitDocs(); if(!hs.length) return "";
  return '<div style="margin:-4px 0 16px"><div style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px"><b style="font-size:12.5px;color:var(--nav)">관련도 순</b>'+
    '<span style="font-size:11px;color:var(--muted)">'+hs.length.toLocaleString()+'건 · 누르면 하단에 AI 검토</span></div>'+
    '<div style="overflow-y:auto;border:1px solid #EDF0F4;border-radius:8px;display:flex;flex-direction:column">'+
    hs.map((x,i)=>{ const on=x===fd;
      return '<button data-focus="'+esc(x.no)+'" style="display:flex;gap:8px;align-items:baseline;text-align:left;width:100%;border:none;border-bottom:1px solid #F0F2F5;padding:7px 10px;font:inherit;font-size:12.5px;line-height:1.45;cursor:pointer;'+
        (on?'background:#ECF2FE;color:#0B50D0;font-weight:700':'background:#fff;color:#1E2124')+'">'+
        '<span style="flex-shrink:0;width:22px;color:#98A2AE;font-size:11px;font-variant-numeric:tabular-nums">'+(i+1)+'</span>'+
        '<span style="flex:1;min-width:0">'+esc(x.title)+'<span style="display:block;font-weight:400;font-size:11px;color:#6D7882;margin-top:1px">#'+esc(x.no)+' · '+esc(x.date||"일자 미기재")+(x.cat?' · '+esc(x.cat):'')+'</span></span></button>';
    }).join("")+'</div></div>';
}

function reviewPlain(){
  const d=focusDoc(); if(!d) return "";
  const r=oneCache(d.no);
  return "검토 대상: 질의회신 제"+d.no+"호 "+d.title+"\n\n"+(r?r.text:gist(d)).replace(/【([^】]+)】/g,"■ $1")+
    "\n\n출처: "+SOURCE_NAME+" ("+source(d)+", "+(d.date||"일자 미기재")+") · 조회일자 "+FETCHED_AT;
}

function openSheet(){
  const d=focusDoc(); if(!d) return;
  const r=oneCache(d.no)||{mode:"auto",text:"【요지】\n"+gist(d)};
  const today=new Date().toLocaleDateString("ko-KR");
  const body=esc(r.text).replace(/【([^】]+)】\s*/g,(m,h)=>'</div><h3>'+h+'</h3><div class="tx">');
  const html='<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>검토서 - 질의회신 제'+esc(d.no)+'호</title>'+
  '<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">'+
  '<style>@page{size:A4;margin:15mm 18mm}*{box-sizing:border-box}body{margin:0;font-family:"Pretendard Variable",Pretendard,sans-serif;color:#1E2124;font-size:9.6pt;line-height:1.62;background:#F4F5F6}'+
  '.pg{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:15mm 18mm;box-shadow:0 2px 12px rgba(0,0,0,.08)}'+
  '.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #063A74;padding-bottom:6px}.top h1{margin:0;font-size:17pt;color:#063A74;letter-spacing:-.02em}.top span{font-size:8.5pt;color:#6D7882}'+
  'table{width:100%;border-collapse:collapse;margin-top:10px;font-size:9pt}th{width:22mm;background:#ECF2FE;color:#063A74;text-align:left;padding:5px 8px;font-weight:700;border:1px solid #D8E5FD}td{padding:5px 8px;border:1px solid #DFE4EB}'+
  'h3{margin:12px 0 3px;font-size:10.5pt;color:#063A74;border-left:3px solid #256EF4;padding-left:7px}.tx{white-space:pre-wrap}'+
  '.orig{white-space:pre-wrap;font-size:8.6pt;line-height:1.6;background:#FAFBFC;border:1px solid #EDF0F4;border-radius:4px;padding:7px 10px;max-height:none}'+
  '.ft{margin-top:12px;padding-top:6px;border-top:1px solid #CDD1D5;font-size:7.8pt;color:#6D7882}.pb{position:fixed;top:14px;right:14px;background:#256EF4;color:#fff;border:none;border-radius:6px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}'+
  '@media print{body{background:#fff}.pg{margin:0;box-shadow:none;width:auto;min-height:0;padding:0}.pb{display:none}}</style></head><body>'+
  '<button class="pb" onclick="print()">인쇄 / PDF 저장</button><div class="pg">'+
  '<div class="top"><h1>질의회신 검토서</h1><span>작성일 '+today+' · '+(r.mode==="ai"?"AI 검토":"자동 요약")+'</span></div>'+
  '<table><tr><th>회신번호</th><td>제'+esc(d.no)+'호</td><th>회신일자</th><td>'+esc(d.date||"미기재")+'</td></tr>'+
  '<tr><th>제목</th><td colspan="3">'+esc(d.title)+'</td></tr><tr><th>소관</th><td>'+esc(source(d))+'</td><th>분야</th><td>'+esc(d.cat||"-")+'</td></tr>'+
  (current?'<tr><th>검색어</th><td colspan="3">'+esc(current.query)+'</td></tr>':'')+'</table>'+
  '<div class="tx">'+body+'</div>'+
  (d.q?'<h3>질의 원문</h3><div class="orig">'+esc(cut(d.q,900))+'</div>':'')+
  '<h3>회신 원문</h3><div class="orig">'+esc(cut(d.a,1300))+'</div>'+
  '<div class="ft">자료 출처: '+SOURCE_NAME+' 질의회신 (조회일자 '+FETCHED_AT+'). 질의회신은 개별 사안에 대한 행정 회신으로 법적 구속력이 있는 유권해석이 아니며, 본 검토서는 참고용입니다. 적용 전 원문과 현행 법령을 확인하십시오.</div>'+
  '</div></body></html>';
  const w=window.open("","_blank"); if(!w){ alert("팝업이 차단되었습니다. 팝업을 허용해 주십시오."); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* ───────── 화면 열고 닫기 ───────── */
const panel=document.getElementById("panel"), side=document.getElementById("side"), scrim=document.getElementById("scrim");
const openPanel =()=>panel.classList.add("open");
const closePanel=()=>panel.classList.remove("open");
const closeSide =()=>{ side.classList.remove("open"); scrim.classList.remove("open"); };

document.getElementById("tpanel").onclick=()=>panel.classList.toggle("open");
document.getElementById("pclose").onclick=closePanel;
const docm=document.getElementById("docm");
document.getElementById("dmclose").onclick=()=>{ docm.classList.remove("open"); openDoc=null; render(); };
docm.addEventListener("click",e=>{ if(e.target===docm){ docm.classList.remove("open"); openDoc=null; render(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") docm.classList.remove("open"); });
document.getElementById("tside").onclick=()=>{ side.classList.toggle("open"); scrim.classList.toggle("open"); };
scrim.onclick=closeSide;
document.getElementById("newbtn").onclick=()=>{ current=null; openDoc=null; closeSide(); render(); };

const q=document.getElementById("q"), send=document.getElementById("send");
q.addEventListener("input",()=>{ send.disabled=!q.value.trim(); });
q.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); run(); } });
send.onclick=()=>run();

document.addEventListener("click",e=>{
  if(e.target.closest("[data-showmore]")){ const y=document.getElementById("scroll").scrollTop; current.shown=(current.shown||PAGE)+PAGE; saveHistory(); render(); document.getElementById("scroll").scrollTop=y; return; }
  const fo=e.target.closest("[data-focus]");
  if(fo){ const pb=document.getElementById("rvbody"), ly=pb.scrollTop, sy=document.getElementById("scroll").scrollTop, fromList=!!fo.closest("#rvbody");
    current.focus=fo.dataset.focus; saveHistory(); render();
    document.getElementById("rvbody").scrollTop=ly; const sc=document.getElementById("scroll"), rb=document.getElementById("rvblock"); sc.scrollTop = rb ? sc.scrollTop+rb.getBoundingClientRect().top-sc.getBoundingClientRect().top-16 : sy;
    if(fromList && window.innerWidth<=1120) closePanel(); return; }
  const one=e.target.closest("[data-one]");
  if(one){ const d=BYNO.get(one.dataset.one); if(d){ try{localStorage.removeItem(ONE_KEY+d.no)}catch(e){} oneReview(d,true); } return; }
  const rv=e.target.closest("[data-rv]");
  if(rv){ const k=rv.dataset.rv;
    if(k==="sheet") openSheet();
    else if(k==="copy"){ navigator.clipboard?.writeText(reviewPlain()); rv.textContent="복사했습니다"; setTimeout(()=>rv.textContent="복사",1500); }
    return; }
  const del=e.target.closest("[data-del]");
  if(del){ e.stopPropagation();
    history=history.filter(x=>x.id!==del.dataset.del); saveHistory();
    if(current&&current.id===del.dataset.del) current=null;
    render(); return; }
  const hi=e.target.closest(".hitem");
  if(hi){ current=history.find(x=>x.id===hi.dataset.id)||null; openDoc=null;
    if(current&&Array.isArray(current.cats)) selected=new Set(current.cats);
    closeSide(); render(); return; }
  const fm=e.target.closest("[data-more]");
  if(fm){ fmore = fm.dataset.more==="1"; renderFilter(); return; }
  const fc=e.target.closest("[data-cat]");
  if(fc){
    const c=fc.dataset.cat;
    if(c==="__all") selected.clear();
    else { selected.has(c) ? selected.delete(c) : selected.add(c); }
    try{ localStorage.setItem("molitqa:cats",JSON.stringify([...selected])) }catch(e){}
    if(current) run(current.query);   // 선택을 바꾸면 같은 검색어로 다시 찾는다
    else render();
    return;
  }
  const tg=e.target.closest("[data-toggle]");
  if(tg){ const n=tg.dataset.toggle; EXPANDED.has(n)?EXPANDED.delete(n):EXPANDED.add(n); render(); return; }
  const pg=e.target.closest("[data-page]");
  if(pg&&current){ current.shown=(current.shown||PAGE)+PAGE; saveHistory(); render(); return; }
  const rn=e.target.closest("[data-run]");
  if(rn){ run(rn.dataset.run); return; }
  const no=e.target.closest("[data-no]");
  if(no){ showDoc(no.dataset.no); }
});

boot();
</script>
