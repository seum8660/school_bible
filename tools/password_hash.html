<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>비밀번호 SHA-256 해시 생성</title></head>
<body style="font-family:sans-serif;max-width:560px;margin:40px auto;line-height:1.6">
<h2>비밀번호 → SHA-256 해시</h2>
<p>여기서 만든 값을 GitHub Secrets(ADMIN_PW_HASH · SITE_PW_SUP_HASH · SITE_PW_REP_HASH)에 넣으세요. 배포본에는 포함되지 않습니다.</p>
<input id="p" type="password" placeholder="비밀번호" style="width:100%;padding:10px;font-size:16px">
<button id="b" style="margin-top:10px;padding:10px 16px">해시 생성</button>
<pre id="o" style="background:#f3f4f6;padding:12px;word-break:break-all;white-space:pre-wrap"></pre>
<script>
document.getElementById('b').onclick=async()=>{const s=document.getElementById('p').value;const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));document.getElementById('o').textContent=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');};
</script></body></html>
