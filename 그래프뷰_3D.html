<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학교시설업무 관계망 · 3D 그래프 뷰</title>
<style>
  :root{
    --bg:#05060a; --surface:#0d0f16; --surface-2:#141824; --surface-3:#1c2130;
    --line:rgba(255,255,255,.13); --ink:#eceaf3; --ink-2:#c6c3d2; --muted:#8e8ba0; --faint:#5f5d73;
    --accent:#7aa2ff; --accent-soft:rgba(122,162,255,.16); --rad:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:28px 24px 40px}
  /* 단독 창에서 전체화면 */
  body.full{overflow:hidden}
  body.full .wrap{max-width:none;margin:0;padding:14px 16px;height:100vh;display:flex;flex-direction:column}
  body.full .hd{margin-bottom:10px}
  body.full .grid{flex:1;min-height:0}
  body.full .stage{height:100%}
  body.full #cv{height:100%!important}
  .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .hd h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .hd p{font-size:13px;color:var(--muted);margin-top:4px;max-width:640px}
  .hd a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
  .hd a:hover{text-decoration:underline}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .sw{position:relative;flex:1;min-width:200px;max-width:320px}
  .sw input{width:100%;height:34px;padding:0 12px 0 30px;border:1px solid var(--line);border-radius:100px;
    background:var(--surface);color:var(--ink);font:inherit;font-size:13px;outline:none}
  .sw input:focus{border-color:var(--accent)}
  .sw span{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--faint)}
  .chip{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:100px;background:var(--surface);
    color:var(--muted);font:inherit;font-size:12.5px;font-weight:500;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
  .stage{position:relative;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;
    background:
      radial-gradient(ellipse 60% 45% at 22% 18%, rgba(88,101,242,.20), transparent 70%),
      radial-gradient(ellipse 55% 40% at 78% 78%, rgba(178,84,220,.16), transparent 72%),
      radial-gradient(ellipse 80% 70% at 50% 50%, #0a0c14 0%, #04050a 100%)}
  .stage .legend{background:rgba(18,18,20,.82);border-color:rgba(255,255,255,.14);color:#c9c6c1}
  .stage .hint{background:rgba(18,18,20,.82);border-color:rgba(255,255,255,.14);color:#9b9791}
  #cv{display:block;width:100%;height:560px}
  #tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:600;
    padding:5px 9px;border-radius:6px;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:4}
  .legend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;
    background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font-size:11.5px;color:var(--muted)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .hint{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--faint)}
  aside{border:1px solid var(--line);border-radius:var(--rad);background:var(--surface);padding:14px 14px 16px}
  aside h4{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  .pt{font-size:15px;font-weight:700;line-height:1.4;word-break:keep-all}
  .pk{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border-radius:100px;padding:2px 9px}
  .pl{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .pl b{display:block;font-size:11px;color:var(--faint);letter-spacing:.05em;margin-bottom:7px}
  .pl button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:12.5px;
    color:var(--ink-2);padding:5px 7px;border-radius:6px;cursor:pointer}
  .pl button:hover{background:var(--surface-2);color:var(--accent)}
  .empty{font-size:12.5px;color:var(--faint);line-height:1.7}
  .stat{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .stat b{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd" id="pageHd">
    <div>
      <h1>학교시설업무 관계망 · 3D 그래프 뷰</h1>
      <p>기존 2D 그래프와 같은 데이터를 3차원 힘 기반 배치로 펼쳤습니다. 드래그로 회전, 스크롤로 확대, 노드를 클릭하면 연결된 항목만 남습니다.</p>
    </div>
    <a href="bible.html">← 치트키로 돌아가기</a>
  </div>

  <div class="bar">
    <div class="sw"><span>🔍</span><input id="q" type="text" placeholder="노드 검색 (예: 일상감사, 석면, BF)"></div>
    <button class="chip on" data-f="all">전체</button>
    <button class="chip" data-f="phase">단계</button>
    <button class="chip" data-f="law">법령</button>
    <button class="chip" data-f="cert">인증</button>
    <button class="chip" data-f="manual">매뉴얼</button>
    <button class="chip" data-f="tag">태그</button>
    <button class="chip" data-f="wf">워크플로우</button>
    <button class="chip" id="grow">가지 펼치기 ↻</button>
    <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap">팔레트
      <select id="pal" style="height:30px;border:1px solid var(--line);border-radius:100px;background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;padding:0 10px;outline:none;cursor:pointer">
        <option value="earth" selected>흑임·토달</option>
        <option value="phase">단계별 색</option>
        <option value="cool">청록 그라데이션</option>
        <option value="mono">모노톤(2D 동일)</option>
      </select>
    </label>
    <button class="chip" id="reset">초기화</button>
  </div>

  <div class="grid">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div id="tip"></div>
      <div class="hint">드래그 회전 · 스크롤 확대 · 클릭 집중</div>
      <div class="legend">
        <span><i data-p="plan" style="background:#3f6f8a"></i>기획</span>
        <span><i data-p="design" style="background:#5b8c6e"></i>설계</span>
        <span><i data-p="const" style="background:#c07a3e"></i>시공</span>
        <span><i data-p="cm" style="background:#8a6a4f"></i>건설관리</span>
        <span><i data-p="comp" style="background:#96794a"></i>준공</span>
        <span><i data-p="safety" style="background:#9c5b4e"></i>교육시설안전</span>
        <span><i data-p="manual" style="background:#7a7168"></i>매뉴얼</span>
        <span><i style="background:#fff;box-shadow:inset 0 0 0 1px #a39e98"></i>법령·인증</span>
      </div>
    </div>
    <aside style="display:none">
      <h4>선택 노드</h4>
      <div id="panel"><p class="empty">노드를 클릭하면 그 항목과 직접 연결된 법령·절차·매뉴얼만 남습니다.<br><br>빈 공간을 클릭하면 전체 보기로 돌아옵니다.</p></div>
      <div class="stat"><span>노드 <b id="nN">0</b></span><span>연결 <b id="nL">0</b></span></div>
    </aside>
  </div>
</div>

<script src="graph_data.js"></script>
<script src="wf_tags.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const G = window.BIBLE_GRAPH;
if (window.WF_GRAPH) {
  const have = new Set(G.nodes.map(n => n.id));
  window.WF_GRAPH.nodes.forEach(n => { if (!have.has(n.id)) { have.add(n.id); G.nodes.push({ ...n }); } });
  window.WF_GRAPH.links.forEach(l => { if (have.has(l.source) && have.has(l.target)) G.links.push({ ...l }); });
}
// 단계별 색상 팔레트 (선택 가능)
const PALETTES = {
  phase: { plan:'#0075de', design:'#00868f', const:'#c9762a', cm:'#7b5bd6', comp:'#2f9e4f', safety:'#c2413a', manual:'#6b6b6b' },
  earth: { plan:'#3f6f8a', design:'#5b8c6e', const:'#c07a3e', cm:'#8a6a4f', comp:'#96794a', safety:'#9c5b4e', manual:'#7a7168' },
  cool:  { plan:'#0b4f8a', design:'#0075de', const:'#3fa0c9', cm:'#5f7fb8', comp:'#2f9e8f', safety:'#4c6b8f', manual:'#8b96a3' },
  mono:  { plan:'#31302e', design:'#4a4845', const:'#615d59', cm:'#7b766f', manual:'#a39e98', comp:'#8e8981', safety:'#94908a' }
};
let PHASE_COL = PALETTES.earth;
const INK2 = '#e4e2ee', MUTED = '#a9a6bb', FAINT = '#7d7a92', ACCENT = '#8fb0ff', SOFT = 'rgba(143,176,255,.18)';
const isHot = n => n.group === 'phase' || n.group === 'root' || n.id === 'wf:hub';
function phaseOf(n) {
  const g = n.group || '', id = n.id || '';
  let m = g.match(/^item:(\w+)/) || id.match(/^(?:phase|item):(\w+)/);
  return m ? m[1] : null;
}
const colorOf = n => {
  if (n.group === 'wf') return '#e8590c';
  if (n.group === 'law' || n.group === 'cert') return '#ffffff';
  const p = phaseOf(n);
  if (p && PHASE_COL[p]) return PHASE_COL[p];
  if (n.group === 'root') return INK2;
  return MUTED;
};
const KIND = { phase:'단계', root:'전체', law:'근거 법령', cert:'인증', tag:'키워드', wf:'워크플로우 보드', 'item:manual':'매뉴얼', 'item:safety':'안전점검·인증' };
const kindOf = n => KIND[n.group] || (n.group.startsWith('item:') ? '절차' : '항목');

const nodes = G.nodes.map(n => ({ ...n }));
const byId = new Map(nodes.map(n => [n.id, n]));
const links = G.links.map(l => ({ s: byId.get(l.source), t: byId.get(l.target), kind: l.kind })).filter(l => l.s && l.t);
const deg = new Map(nodes.map(n => [n.id, 0]));
links.forEach(l => { deg.set(l.s.id, deg.get(l.s.id) + 1); deg.set(l.t.id, deg.get(l.t.id) + 1); });
const nbr = new Map(nodes.map(n => [n.id, new Set()]));
links.forEach(l => { nbr.get(l.s.id).add(l.t.id); nbr.get(l.t.id).add(l.s.id); });
document.getElementById('nN').textContent = nodes.length;
document.getElementById('nL').textContent = links.length;
const rad = n => Math.max(2.2, Math.min(8, 2.2 + Math.sqrt(deg.get(n.id) || 1) * 1.5));

// ---- 3D force layout (spring–charge, O(n²) is fine at this size) ----
nodes.forEach(n => {
  const r = 120 * Math.cbrt(Math.random()), th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
  n.x = r * Math.sin(ph) * Math.cos(th); n.y = r * Math.sin(ph) * Math.sin(th); n.z = r * Math.cos(ph);
  n.vx = n.vy = n.vz = 0;
});
const restOf = l => l.kind === 'flow' ? 105 : l.kind === 'phase' ? 66 : 40;
let alpha = 1;
function tick() {
  if (alpha < 0.004) return;
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j];
    let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
    let d2 = dx * dx + dy * dy + dz * dz || 0.01;
    const f = -2600 / d2, d = Math.sqrt(d2);
    dx /= d; dy /= d; dz /= d;
    a.vx += dx * f; a.vy += dy * f; a.vz += dz * f;
    b.vx -= dx * f; b.vy -= dy * f; b.vz -= dz * f;
  }
  links.forEach(l => {
    const a = l.s, b = l.t, rest = restOf(l);
    let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.01;
    const f = (d - rest) * 0.055;
    dx = dx / d * f; dy = dy / d * f; dz = dz / d * f;
    a.vx += dx; a.vy += dy; a.vz += dz;
    b.vx -= dx; b.vy -= dy; b.vz -= dz;
  });
  nodes.forEach(n => {
    n.vx -= n.x * 0.006; n.vy -= n.y * 0.006; n.vz -= n.z * 0.006;
    n.x += n.vx *= 0.62; n.y += n.vy *= 0.62; n.z += n.vz *= 0.62;
  });
  alpha *= 0.988;
}
for (let k = 0; k < 260; k++) tick();

// ---- scene ----
const cv = document.getElementById('cv'), stage = cv.parentElement;
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, 1, 1, 4000);
camera.position.set(0, 60, 420);
const controls = new OrbitControls(camera, cv);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.rotateSpeed = 0.7;
controls.minDistance = 90; controls.maxDistance = 1200;

const root = new THREE.Group(); scene.add(root);

// ---- 별밭 (원경·근경 2겹) ----
function starfield(count, spread, size, opacity) {
  const g = new THREE.BufferGeometry(), p = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = spread * (0.55 + Math.random() * 0.45);
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    p.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph) * 0.6, r * Math.sin(ph) * Math.sin(th)], i * 3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xffffff, size, sizeAttenuation: true, transparent: true,
    opacity, depthWrite: false, blending: THREE.AdditiveBlending
  }));
}
const stars = new THREE.Group();
stars.add(starfield(1400, 2600, 3.4, 0.75));
stars.add(starfield(700, 1500, 2.0, 0.42));
scene.add(stars);

// links
const lgeo = new THREE.BufferGeometry();
const lpos = new Float32Array(links.length * 6);
links.forEach((l, i) => {
  lpos.set([l.s.x, l.s.y, l.s.z, l.t.x, l.t.y, l.t.z], i * 6);
});
lgeo.setAttribute('position', new THREE.BufferAttribute(lpos, 3));
const lcol = new Float32Array(links.length * 6).fill(0.62);
lgeo.setAttribute('color', new THREE.BufferAttribute(lcol, 3));
const lines = new THREE.LineSegments(lgeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.2, linewidth: 1, blending: THREE.AdditiveBlending, depthWrite: false }));
root.add(lines);

// 광채 텍스처
const GLOW = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(.28, 'rgba(255,255,255,.45)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();

// nodes as spheres
const sphere = new THREE.SphereGeometry(1, 14, 12);
const meshes = nodes.map(n => {
  const m = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ color: new THREE.Color(colorOf(n)) }));
  m.position.set(n.x, n.y, n.z);
  m.scale.setScalar(rad(n));
  m.userData.node = n;
  root.add(m);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW, color: new THREE.Color(colorOf(n)), transparent: true,
    opacity: isHot(n) ? 0.9 : 0.55, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glow.scale.setScalar(isHot(n) ? 7 : 5);
  m.add(glow);
  if (n.group === 'law' || n.group === 'cert') {
    const ring = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ color: new THREE.Color(FAINT), wireframe: true, transparent: true, opacity: .5 }));
    ring.scale.setScalar(1.12); m.add(ring);
  }
  return m;
});

// labels (only prominent nodes get a sprite)
function labelSprite(text, hot, dim, tint) {
  const pad = 8, fs = hot ? 30 : (dim ? 22 : 26), c = document.createElement('canvas'), g = c.getContext('2d');
  const wt = hot ? 700 : (dim ? 500 : 600);
  g.font = `${wt} ${fs}px -apple-system, "Malgun Gothic", sans-serif`;
  const w = g.measureText(text).width;
  c.width = Math.ceil(w + pad * 2); c.height = fs + pad * 2;
  g.font = `${wt} ${fs}px -apple-system, "Malgun Gothic", sans-serif`;
  if (hot) {
    g.fillStyle = (tint || ACCENT) + '1f';
    g.beginPath(); g.roundRect(0, 0, c.width, c.height, c.height / 2); g.fill();
  }
  g.fillStyle = hot ? (tint || ACCENT) : (dim ? FAINT : INK2);
  g.textBaseline = 'middle';
  g.fillText(text, pad, c.height / 2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(c.width * 0.26, c.height * 0.26, 1);
  return sp;
}
const labels = [];
nodes.forEach((n, i) => {
  const hot = isHot(n);
  const txt = n.label.length > 13 ? n.label.slice(0, 13) + '…' : n.label;
  const sp = labelSprite(txt, hot, n.group === 'law' || n.group === 'cert', colorOf(n));
  sp.position.set(n.x, n.y + rad(n) + 7, n.z);
  sp.userData = { node: n, mesh: meshes[i] };
  root.add(sp); labels.push(sp);
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight || cv.clientHeight || 560;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// recenter on centroid, then frame the bulk (85th percentile radius)
const _c = nodes.reduce((a, n) => (a.x += n.x, a.y += n.y, a.z += n.z, a), { x: 0, y: 0, z: 0 });
_c.x /= nodes.length; _c.y /= nodes.length; _c.z /= nodes.length;
nodes.forEach(n => { n.x -= _c.x; n.y -= _c.y; n.z -= _c.z; });
meshes.forEach((m, i) => m.position.set(nodes[i].x, nodes[i].y, nodes[i].z));
{ const p = lgeo.getAttribute('position');
  links.forEach((l, i) => p.array.set([l.s.x, l.s.y, l.s.z, l.t.x, l.t.y, l.t.z], i * 6));
  p.needsUpdate = true; }
const _rs = nodes.map(n => Math.hypot(n.x, n.y, n.z)).sort((a, b) => a - b);
const R0 = Math.max(1, _rs[Math.floor(_rs.length * 0.85)]);
const DIST = R0 / Math.tan((camera.fov * Math.PI / 180) / 2) * 1.1;
camera.position.set(0, 0, DIST);
controls.maxDistance = DIST * 4;
controls.update();

// ---- interaction ----
const ray = new THREE.Raycaster(), pv = new THREE.Vector2();
const tip = document.getElementById('tip');
let hover = null, sel = null, filter = 'all', query = '';

function groupKey(n) {
  if (n.group === 'wf') return 'wf';
  if (n.group === 'law') return 'law';
  if (n.group === 'cert') return 'cert';
  if (n.group === 'tag') return 'tag';
  if (n.group === 'item:manual') return 'manual';
  if (n.group === 'item:safety') return 'safety';
  if (n.group === 'phase' || n.group === 'root') return 'phase';
  return 'item';
}
function visible(n) {
  if (filter !== 'all' && groupKey(n) !== filter && n.group !== 'phase' && n.group !== 'root') return false;
  if (query && !n.label.toLowerCase().includes(query)) return false;
  return true;
}
function paint() {
  const focus = sel ? nbr.get(sel.id) : null;
  meshes.forEach((m, i) => {
    const n = nodes[i];
    let o = visible(n) ? 1 : 0.06;
    if (focus && !(n.id === sel.id || focus.has(n.id))) o = Math.min(o, 0.05);
    m.material.opacity = o; m.material.transparent = o < 1;
    m.visible = o > 0.02;
  });
  labels.forEach(sp => {
    const n = sp.userData.node;
    let on = visible(n) && (!focus || n.id === sel.id || focus.has(n.id));
    sp.visible = on;
  });
  const arr = lgeo.getAttribute('color');
  links.forEach((l, i) => {
    let v = (visible(l.s) && visible(l.t)) ? 0.78 : 0.95;
    if (focus) v = (l.s.id === sel.id || l.t.id === sel.id) ? 0.35 : 0.97;
    for (let k = 0; k < 6; k++) arr.array[i * 6 + k] = v;
  });
  arr.needsUpdate = true;
}
function showPanel(n) {
  const p = document.getElementById('panel');
  if (!n) { p.innerHTML = '<p class="empty">노드를 클릭하면 그 항목과 직접 연결된 법령·절차·매뉴얼만 남습니다.<br><br>빈 공간을 클릭하면 전체 보기로 돌아옵니다.</p>'; return; }
  const rel = [...nbr.get(n.id)].map(id => byId.get(id));
  const link = n.url ? `<a href="${n.url}" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;color:${ACCENT};text-decoration:none">워크플로우 보드 열기 ↗</a>`
    : (n.tag ? `<a href="bible.html#tag=${encodeURIComponent(n.tag)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin:8px 0 2px;font-size:12px;font-weight:700;color:${ACCENT};text-decoration:none">#${n.tag} 검색 ↗</a>` : '');
  p.innerHTML = `<div class="pt">${n.label}</div><span class="pk">${kindOf(n)}</span>${link}
    <div class="pl"><b>연결 ${rel.length}건</b>${rel.map(r => `<button data-id="${r.id}">${r.label}</button>`).join('')}</div>`;
  p.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    sel = byId.get(b.dataset.id); paint(); showPanel(sel); flyTo(sel);
  }));
}
function flyTo(n) {
  const target = new THREE.Vector3(n.x, n.y, n.z);
  const from = controls.target.clone(), t0 = performance.now();
  (function step() {
    const k = Math.min(1, (performance.now() - t0) / 420), e = 1 - Math.pow(1 - k, 3);
    controls.target.lerpVectors(from, target, e);
    if (k < 1) requestAnimationFrame(step);
  })();
}
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  pv.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(pv, camera);
  const hit = ray.intersectObjects(meshes.filter(m => m.visible), false)[0];
  hover = hit ? hit.object.userData.node : null;
  if (hover) {
    tip.textContent = hover.label + ' · ' + kindOf(hover);
    tip.style.left = (e.clientX - r.left + 12) + 'px';
    tip.style.top = (e.clientY - r.top - 8) + 'px';
    tip.style.opacity = 1; cv.style.cursor = 'pointer';
  } else { tip.style.opacity = 0; cv.style.cursor = 'grab'; }
});
cv.addEventListener('pointerdown', () => {});
cv.addEventListener('click', () => {
  sel = hover && (!sel || sel.id !== hover.id) ? hover : null;
  paint(); showPanel(sel); if (sel) flyTo(sel);
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); paint(); });
document.querySelectorAll('.chip[data-f]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); filter = b.dataset.f; paint();
}));
document.getElementById('pal').addEventListener('change', e => {
  PHASE_COL = PALETTES[e.target.value] || PALETTES.phase;
  meshes.forEach((m, i) => m.material.color.set(colorOf(nodes[i])));
  document.querySelectorAll('.legend i[data-p]').forEach(el => {
    el.style.background = PHASE_COL[el.dataset.p];
  });
});

document.getElementById('reset').addEventListener('click', () => {
  sel = null; query = ''; filter = 'all';
  document.getElementById('q').value = '';
  document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.toggle('on', x.dataset.f === 'all'));
  controls.target.set(0, 0, 0); camera.position.set(0, 0, DIST);
  paint(); showPanel(null); growReset();
});

// ---- 가지 펼치기 애니메이션 (root에서 BFS 파동) ----
const home = new Map(nodes.map(n => [n.id, { x: n.x, y: n.y, z: n.z }]));
const parent = new Map(), depth = new Map();
{
  const start = byId.get('root') || nodes[0];
  depth.set(start.id, 0);
  const q = [start];
  while (q.length) {
    const cur = q.shift();
    nbr.get(cur.id).forEach(id => {
      if (depth.has(id)) return;
      depth.set(id, depth.get(cur.id) + 1);
      parent.set(id, cur.id);
      q.push(byId.get(id));
    });
  }
  nodes.forEach(n => { if (!depth.has(n.id)) { depth.set(n.id, 1); parent.set(n.id, start.id); } });
}
const maxDepth = Math.max(...depth.values());
const BASE_STEP = 90, BASE_DUR = 480;
const speed = 0.3, STEP = BASE_STEP / speed, DUR = BASE_DUR / speed;
let growT0 = performance.now(), growing = true;
const ease = t => 1 - Math.pow(1 - t, 3);
function growTick(now) {
  const el = now - growT0;
  let allDone = true;
  nodes.forEach(n => {
    const d = depth.get(n.id);
    let p = (el - d * STEP) / DUR;
    if (p < 1) allDone = false;
    p = Math.max(0, Math.min(1, p));
    n.grow = p;
    const h = home.get(n.id);
    if (d === 0 || p >= 1) { n.x = h.x; n.y = h.y; n.z = h.z; return; }
    const ph = home.get(parent.get(n.id)) || h, e = ease(p);
    n.x = ph.x + (h.x - ph.x) * e;
    n.y = ph.y + (h.y - ph.y) * e;
    n.z = ph.z + (h.z - ph.z) * e;
  });
  meshes.forEach((m, i) => {
    const n = nodes[i];
    m.position.set(n.x, n.y, n.z);
    m.scale.setScalar(rad(n) * (0.35 + 0.65 * n.grow));
  });
  const p = lgeo.getAttribute('position');
  links.forEach((l, i) => p.array.set([l.s.x, l.s.y, l.s.z, l.t.x, l.t.y, l.t.z], i * 6));
  p.needsUpdate = true;
  labels.forEach(sp => { sp.material.opacity = Math.max(0, Math.min(1, (sp.userData.node.grow - 0.35) / 0.65)); });
  if (allDone) { growing = false; labels.forEach(sp => sp.material.opacity = 1); paint(); }
}
function growReset() {
  growT0 = performance.now(); growing = true;
  sel = null; showPanel(null);
  growTick(growT0);
}
document.getElementById('grow').addEventListener('click', growReset);

paint();
growReset();
(function loop(now) {
  requestAnimationFrame(loop);
  if (growing) growTick(now || performance.now());
  controls.update();
  labels.forEach(sp => { const n = sp.userData.node; sp.position.set(n.x, n.y + rad(n) + 7, n.z); });
  renderer.render(scene, camera);
})();
</script>
