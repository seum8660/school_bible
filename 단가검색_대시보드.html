  '교실 신축':'<rect x="3" y="5" width="14" height="14" rx="1.2"/><path d="M6 9h8M6 13h5"/><path d="M19 5v6M16 8h6"/>',
  '강당 및 생활관':'<path d="M3 10 12 4l9 6"/><path d="M5 10v10h14V10"/><path d="M9 20v-5h6v5"/>',
  '운동장':'<rect x="2.5" y="7" width="19" height="10" rx="5"/><rect x="7" y="10" width="10" height="4" rx="2"/>',
  '통신장비단가(교실 신・증축 시)':'<path d="M12 13v8"/><circle cx="12" cy="10" r="2"/><path d="M7.5 5.5a7 7 0 0 0 0 9M16.5 5.5a7 7 0 0 1 0 9"/>'
};
function renderPriceNav(){
  const el=document.getElementById('price-sc'); if(!el) return;
  const total=PRICE.cats.reduce((s,c)=>s+c.items.length,0);
  const mk=(key,label,n)=>`<button type="button" data-prc="${esc(key)}"${PR_CAT===key?' class="on"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${PR_ICON[key]||PR_ICON['']}</svg><span>${esc(label)}</span><em>${n}개 항목</em></button>`;
  el.innerHTML = mk('','전체',total) + PRICE.cats.map(c=>mk(c.cat, c.cat, c.items.length)).join('');
  el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    PR_CAT = (PR_CAT===b.dataset.prc) ? '' : b.dataset.prc;
    renderPriceNav(); renderPrice(document.getElementById('price-q').value);
  }));
}
function prBase(rw){ const u=rw[2]||'식', a=rw[3]; return (a && u==='㎡') ? a+'㎡' : u; }
function renderPrice(q){
  q=(q||'').trim().toLowerCase();
  let html='';
  PRICE.cats.filter(c=>!PR_CAT||c.cat===PR_CAT).forEach(c=>{
    const items=c.items.filter(it=>!q||((it.name+' '+it.rows.map(r=>r[0]).join(' ')).toLowerCase().includes(q)));
    if(!items.length) return;
    html+=`<div class="pr-ghead"><h3>${esc(c.cat)}</h3><span class="cnt">${items.length}</span></div>`;
    html+='<div class="pr-tbl"><table><thead><tr><th>품명</th><th>규격 · 조건</th><th class="num">기준단위</th><th class="num">단가(천원)</th></tr></thead><tbody>';
    html+=items.map(it=>{
      const n=it.rows.length||1;
      return (it.rows.length?it.rows:[['','']]).map((rw,ri)=>{
        const nameTd = ri===0 ? `<td class="nm" rowspan="${n}">${esc(it.name)}</td>` : '';
        return `<tr>${nameTd}<td class="sp">${esc(rw[4]!==undefined?rw[4]:rw[0])||'–'}</td><td class="un">${esc(prBase(rw))}</td><td class="pr">${esc(rw[1])}</td></tr>`;
      }).join('');
    }).join('');
    html+='</tbody></table></div>';
  });
  document.getElementById('price-body').innerHTML = html || '<div class="res-empty">검색 결과가 없습니다.</div>';
  document.getElementById('price-footnote').innerHTML = ''+esc(PRICE.foot||'');
}
document.getElementById('price-q').addEventListener('input',e=>renderPrice(e.target.value));
renderPriceNav();
renderPrice('');
</script>
