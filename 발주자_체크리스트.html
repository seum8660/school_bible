<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>발주자 의무 체크리스트 — 학교시설사업</title>
<style>
  :root{
    --bg:#f2f4f6; --card:#fff; --line:#c4ccd6; --line2:#eaedf0;
    --ink:#191f28; --sub:#8b95a1; --accent:#1b64da; --accent-soft:#e8f2ff;
    --plan:#3182f6; --design:#12b886; --const:#f59f00; --comp:#4263eb; --risk:#c0392b;
    --sans:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
  header{background:var(--card);border-bottom:1.5px solid var(--line)}
  .hd{max-width:1180px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .chip{background:var(--accent);color:#fff;font-size:12px;font-weight:800;padding:5px 13px;border-radius:100px}
  h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.6px}
  .hd p{margin:2px 0 0;font-size:13px;color:var(--sub)}
  .sp{flex:1}
  .btn{background:var(--card);border:1.5px solid var(--line);border-radius:100px;padding:9px 16px;
       font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 6px}
  .kpi .c{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center}
  .kpi .nm{font-size:12.5px;font-weight:700;color:var(--sub)}
  .kpi .vl{font-size:26px;font-weight:900;letter-spacing:-1px;margin-top:3px}
  .kpi .c.done .vl{color:var(--accent)}
  .bar{height:10px;background:var(--line2);border-radius:100px;overflow:hidden;margin:14px 0 22px;border:1.5px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}

  .grp{background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .grp-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1.5px solid var(--line2);
         font-size:15.5px;font-weight:800;cursor:pointer}
  .grp-h .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .grp-h .cnt{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--sub)}
  .grp-b{padding:6px 0}
  .grp.closed .grp-b{display:none}

  .it{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2);align-items:flex-start;cursor:pointer}
  .it:last-child{border-bottom:none}
  .it:hover{background:#f7f9fb}
  .it .cb{width:21px;height:21px;flex:0 0 auto;border:2px solid var(--line);border-radius:6px;margin-top:2px;
          display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;font-weight:900}
  .it.on .cb{background:var(--accent);border-color:var(--accent);color:#fff}
  .it.on .t{text-decoration:line-through;color:var(--sub)}
  .it .bd{flex:1;min-width:0}
  .it .t{font-size:14.5px;font-weight:700}
  .it .d{font-size:12.5px;color:var(--sub);margin-top:2px;word-break:keep-all}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .tg{font-size:11px;font-weight:700;padding:2px 9px;border-radius:100px;white-space:nowrap}
  .tg.law{background:#f1f3f5;color:#495057}
  .tg.money{background:#fdeceb;color:var(--risk)}
  .tg.risk{background:var(--risk);color:#fff}

  @media print{
    @page{size:A4 portrait;margin:10mm}
    body{background:#fff}
    .btn,.filters,.bar,.kpi{display:none!important}
    #pv{display:none!important}
    .grp{break-inside:auto;page-break-inside:auto}
    .grp-h{break-after:avoid;page-break-after:avoid}
    .it{break-inside:avoid;page-break-inside:avoid}
    .grp.closed .grp-b{display:block!important}
  }
  @media print{
    body.pvon>header,body.pvon>.wrap{display:none!important}
    body.pvon #pv{display:block!important;position:static;background:#fff;overflow:visible;padding:0}
    body.pvon #pv>div:first-child{display:none!important}
    body.pvon #pv-body{transform:none!important;display:block;padding:0;gap:0}
    body.pvon #pv-body>div{box-shadow:none!important;width:auto!important;height:auto!important;padding:0!important;overflow:visible!important;break-after:page;page-break-after:always}
    body.pvon #pv-body>div:last-child{break-after:auto;page-break-after:auto}
  }
  @media(max-width:760px){ .kpi{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<header>
  <div class="hd">
    <span class="chip">체크</span>
    <div><h1>발주자 의무 체크리스트</h1><p>학교시설사업 단계별 발주청 법정 의무사항 · 미이행 시 벌칙·과태료 포함</p></div>
    <div class="sp"></div>
    <button class="btn" id="expandAll">모두 접기</button>
    <button class="btn" id="resetBtn">↺ 초기화</button>
    <button class="btn" id="pvBtn">📄 PDF 미리보기</button>
    <button class="btn" id="printBtn">🖨 PDF 저장</button>
  </div>
</header>
<div id="pv" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(20,22,30,.72);overflow:auto">
  <div style="position:sticky;top:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:12px;background:rgba(20,22,30,.9)">
    <span style="color:#fff;font-weight:800;font-size:14px;margin-right:8px">PDF 미리보기 (A4)</span>
    <button class="btn" style="background:var(--accent);border-color:var(--accent);color:#fff" onclick="window.print()">🖨 PDF 출력하기</button>
    <button class="btn" style="background:#fff" onclick="pvClose()">✕ 닫기</button>
  </div>
  <div id="pv-body" style="display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 12px 40px"></div>
</div>

<div class="wrap">
  <div class="kpi" id="kpi"></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</div>

  let html='', total=0, dn=0, risk=0, riskDone=0;
  DATA.forEach((g,gi)=>{
    let rows='', gt=0, gd=0;
    g.items.forEach((it,ii)=>{
      const id=idOf(gi,ii), on=!!done[id];
      total++; gt++; if(on){dn++; gd++;}
      if(it[4]){ risk++; if(on) riskDone++; }
      if(filter==='todo'&&on) return;
      if(filter==='done'&&!on) return;
      if(filter==='risk'&&!it[4]) return;
      rows+=`<div class="it${on?' on':''}" data-id="${id}">
        <span class="cb">✓</span>
        <div class="bd">
          <div class="t">${esc(it[0])}</div>
          <div class="d">${esc(it[1])}</div>
          <div class="tags">
            ${it[3].trim()?`<span class="tg money">${esc(it[3])}</span>`:''}
            <span class="tg law">${esc(it[2])}</span>
            ${it[4]?'<span class="tg risk">벌칙·과태료</span>':''}
          </div>
        </div>
      </div>`;
    });
    if(!rows) return;
    html+=`<div class="grp" data-g="${gi}">
      <div class="grp-h"><span class="dot" style="background:${g.color}"></span>${esc(g.g)}
        <span class="cnt">${gd} / ${gt}</span></div>
      <div class="grp-b">${rows}</div>
    </div>`;
  });
  document.getElementById('list').innerHTML=html||'<div style="padding:40px;text-align:center;color:var(--sub)">해당 항목이 없습니다.</div>';

  document.getElementById('kpi').innerHTML=`
    <div class="c"><div class="nm">전체 항목</div><div class="vl">${total}</div></div>
    <div class="c done"><div class="nm">완료</div><div class="vl">${dn}</div></div>
    <div class="c"><div class="nm">미완료</div><div class="vl">${total-dn}</div></div>
    <div class="c"><div class="nm">벌칙 대상</div><div class="vl" style="color:var(--risk)">${risk-riskDone}</div></div>
    <div class="c"><div class="nm">이행률</div><div class="vl">${total?Math.round(dn/total*100):0}<span style="font-size:14px">%</span></div></div>`;
  document.getElementById('barFill').style.width=(total?dn/total*100:0)+'%';
}

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');
  if(f){ filter=f.dataset.f; render(); return; }
  const h=e.target.closest('.grp-h');
  if(h){ h.parentNode.classList.toggle('closed'); return; }
  const it=e.target.closest('.it');
  if(it){
    const id=it.dataset.id;
    done[id]=!done[id];
    try{ localStorage.setItem(KEY,JSON.stringify(done)); }catch(e){}
    render();
  }
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm('체크한 내용을 모두 초기화할까요?')) return;
  done={}; try{ localStorage.removeItem(KEY); }catch(e){}
  render();
});
document.getElementById('printBtn').addEventListener('click',()=>window.print());
window.pvClose=function(){ document.getElementById('pv').style.display='none'; document.body.classList.remove('pvon'); document.body.style.overflow=''; };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') pvClose(); });
document.getElementById('pvBtn').addEventListener('click',function(){
  const src=document.getElementById('list'), pv=document.getElementById('pv'), body=document.getElementById('pv-body');
  const PAD=12, H=297, W=210, mm=n=>n*96/25.4, LIMIT=mm(H-PAD*2);
  body.innerHTML='';
  pv.style.display='block'; document.body.classList.add('pvon'); document.body.style.overflow='hidden';
  const newSheet=()=>{ const s=document.createElement('div');
    s.style.cssText=`width:${W}mm;height:${H}mm;background:#fff;padding:${PAD}mm;box-sizing:border-box;overflow:hidden;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.35)`;
    const inner=document.createElement('div'); s.appendChild(inner); body.appendChild(s); return inner; };
  let page=newSheet();
  const fits=()=>page.scrollHeight<=LIMIT+1;
  const push=n=>{ page.appendChild(n); if(!fits()&&page.childNodes.length>1){ page.removeChild(n); page=newSheet(); page.appendChild(n); } };
  const ttl=document.createElement('div');
  ttl.style.cssText='font-size:18px;font-weight:900;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid #191f28';
  ttl.textContent='발주자 의무 체크리스트 — 학교시설사업';
  push(ttl);
  [...src.children].forEach(grp=>{
    const head=grp.querySelector('.grp-h'), items=[...grp.querySelectorAll('.it')];
    const shell=()=>{ const g=grp.cloneNode(false); g.classList.remove('closed');
      if(head) g.appendChild(head.cloneNode(true));
      const b=document.createElement('div'); b.className='grp-b'; g.appendChild(b); return {g,b}; };
    let cur=shell(); push(cur.g);
    items.forEach(it=>{ cur.b.appendChild(it.cloneNode(true));
      if(!fits()){ cur.b.lastChild.remove(); const keep=it; cur=shell(); page=newSheet(); page.appendChild(cur.g); cur.b.appendChild(keep.cloneNode(true)); } });
  });
  [...body.children].forEach((s,i,a)=>{ const n=document.createElement('div');
    n.style.cssText='position:absolute;right:12mm;bottom:6mm;font-size:9pt;color:#888';
    n.textContent=`${i+1} / ${a.length}`; s.appendChild(n); });
  const first=body.firstElementChild;
  const scale=first?Math.min(1,(window.innerWidth-48)/first.offsetWidth):1;
  body.style.transform=scale<1?'scale('+scale+')':'';
  body.style.transformOrigin='top center';
});
document.getElementById('expandAll').addEventListener('click',function(){
  const any=document.querySelector('.grp.closed');
  document.querySelectorAll('.grp').forEach(g=>g.classList.toggle('closed',!any));
  this.textContent=any?'모두 접기':'모두 펼치기';
});
render();
</script>
</body>
</html>
