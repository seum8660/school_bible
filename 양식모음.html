<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>각종 양식모음 — 학교시설업무 치트키</title>
<style>
  :root{--bg:#f2f4f6;--card:#fff;--line:#c4ccd6;--ink:#191f28;--sub:#8b95a1;
        --accent:#1b64da;--accent-soft:#e8f2ff;--risk:#c0392b;
        --sans:'Pretendard','Malgun Gothic',sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
  header{background:var(--card);border-bottom:1.5px solid var(--line)}
  .hd{max-width:1100px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .chip{background:var(--accent);color:#fff;font-size:12px;font-weight:800;padding:5px 13px;border-radius:100px}
  h1{margin:0;font-size:21px;font-weight:900;letter-spacing:-.5px}
  .hd p{margin:2px 0 0;font-size:13px;color:var(--sub)}
  .sp{flex:1}
  .wrap{max-width:1100px;margin:0 auto;padding:24px}
  .btn{background:var(--card);border:1.5px solid var(--line);border-radius:100px;padding:10px 18px;
       font:inherit;font-size:13.5px;font-weight:800;color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .drop{border:2.5px dashed var(--line);border-radius:16px;background:var(--card);
        padding:34px 20px;text-align:center;margin-bottom:18px;transition:.15s}
  .drop.on{border-color:var(--accent);background:var(--accent-soft)}
  .drop .ic{font-size:34px}
  .drop .t{font-size:15px;font-weight:800;margin-top:8px}
  .drop .d{font-size:13px;color:var(--sub);margin-top:4px}
  .list{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #eaedf0}
  .row:last-child{border-bottom:none}
  .row .ic{width:38px;height:38px;flex:0 0 auto;border-radius:10px;background:var(--accent-soft);
           color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:17px}
  .row .bd{flex:1;min-width:0}
  .row .nm{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .mt{font-size:12px;color:var(--sub);margin-top:2px}
  .row a.dl{text-decoration:none;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;
            padding:7px 14px;border-radius:100px;white-space:nowrap}
  .row button.del{border:1.5px solid #f0c4bf;background:#fff;color:var(--risk);border-radius:100px;
                  padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .empty{padding:44px;text-align:center;color:var(--sub);font-size:13.5px}
  .note{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;
        font-size:12.5px;color:var(--sub);margin-top:16px;line-height:1.7}
  .bar{height:6px;background:#eaedf0;border-radius:100px;overflow:hidden;margin-top:10px;display:none}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
</style>
</head>
<body>
<header>
  <div class="hd">
    <span class="chip">자료실</span>
    <div><h1>각종 양식모음</h1><p>업무 서식·양식을 올리고 함께 내려받는 공유 자료실 (Firebase 연동)</p></div>
    <div class="sp"></div>
    <a class="btn" href="index.html">← 치트키로</a>
  </div>
</header>

<div class="wrap">
  <div class="drop" id="drop">
    <div class="ic">📤</div>
    <div class="t">여기에 파일을 끌어다 놓거나 클릭해 업로드</div>
    <div class="d">한글·워드·엑셀·PDF·이미지 등 · 업로드 즉시 모든 사용자에게 공유됩니다</div>
    <div class="bar" id="bar"><i></i></div>
    <input type="file" id="file" multiple style="display:none">
  </div>

  <div class="list" id="list"><div class="empty">불러오는 중…</div></div>

  <div class="note">
    💡 업로드한 파일은 Firebase Storage에 저장되어 <b>어느 기기에서든 목록·다운로드</b>가 가능합니다.<br>
    ⚠ 개인정보·대외비 문서는 올리지 마세요. 삭제는 목록의 <b>삭제</b> 버튼으로 가능합니다.
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";

const app = initializeApp({
  apiKey:"AIzaSyAcj1x4W3u4AEBg0MToDDCQjlijEWmxQtc",
  authDomain:"buildlog-2f92c.firebaseapp.com",
  projectId:"buildlog-2f92c",
  storageBucket:"buildlog-2f92c.firebasestorage.app",
  messagingSenderId:"91502436724",
  appId:"1:91502436724:web:95a0d2560fe0b71c984c21"
});
const db=getFirestore(app), st=getStorage(app);
const metaRef=doc(db,'bible_forms','index');

const $=id=>document.getElementById(id);
const list=$('list'), drop=$('drop'), fileIn=$('file'), bar=$('bar');
let items=[];

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const size=n=>n>1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';
const icon=n=>{const e=(n.split('.').pop()||'').toLowerCase();
  if(['xlsx','xls','xlsm','csv'].includes(e))return'📊';
  if(['doc','docx','hwp','hwpx'].includes(e))return'📄';
  if(e==='pdf')return'📕';
  if(['png','jpg','jpeg','gif','webp'].includes(e))return'🖼';
  if(['zip','7z','rar'].includes(e))return'🗜';
  return'📎';};

function render(){
  if(!items.length){ list.innerHTML='<div class="empty">아직 등록된 양식이 없습니다. 위에 파일을 올려 주세요.</div>'; return; }
  list.innerHTML=items.slice().sort((a,b)=>b.at-a.at).map(f=>`
    <div class="row">
      <span class="ic">${icon(f.name)}</span>
      <div class="bd">
        <div class="nm">${esc(f.name)}</div>
        <div class="mt">${size(f.size)} · ${new Date(f.at).toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'})}</div>
      </div>
      <a class="dl" href="${f.url}" target="_blank" rel="noopener noreferrer" download>⬇ 다운로드</a>
      <button class="del" data-p="${esc(f.path)}">삭제</button>
    </div>`).join('');
}

onSnapshot(metaRef, s=>{ const d=s.data(); items=(d&&d.items)||[]; render(); },
  ()=>{ list.innerHTML='<div class="empty">목록을 불러오지 못했습니다. 네트워크·Firebase 설정을 확인하세요.</div>'; });

async function upload(files){
  if(!files.length) return;
  bar.style.display='block';
  const add=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const path='forms/'+Date.now()+'_'+f.name;
    try{
      const r=sref(st,path);
      await uploadBytes(r,f);
      const url=await getDownloadURL(r);
      add.push({name:f.name,size:f.size,path,url,at:Date.now()});
    }catch(e){ alert(f.name+' 업로드 실패: '+e.message); }
    bar.querySelector('i').style.width=Math.round((i+1)/files.length*100)+'%';
  }
  if(add.length){ items=items.concat(add); await setDoc(metaRef,{items,at:Date.now()}); }
  setTimeout(()=>{ bar.style.display='none'; bar.querySelector('i').style.width='0'; },600);
}

drop.addEventListener('click',()=>fileIn.click());
fileIn.addEventListener('change',e=>{ upload([...e.target.files]); fileIn.value=''; });
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on');}));
drop.addEventListener('drop',e=>upload([...e.dataTransfer.files]));

list.addEventListener('click',async e=>{
  const b=e.target.closest('.del'); if(!b) return;
  const path=b.dataset.p;
  const it=items.find(x=>x.path===path); if(!it) return;
  if(!confirm('['+it.name+'] 파일을 삭제할까요?')) return;
  try{ await deleteObject(sref(st,path)); }catch(err){}
  items=items.filter(x=>x.path!==path);
  await setDoc(metaRef,{items,at:Date.now()});
});
</script>
</body>
</html>
