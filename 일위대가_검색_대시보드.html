<!DOCTYPE html>
<html lang="ko" data-layout="B">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>일위대가 단가 검색</title>
<style>
  :root{
    --bg:#f6f5f4; --panel:#ffffff; --panel2:#f6f5f4; --line:#e6e6e6;
    --text:#000000; --sub:#8a847d; --accent:#0075de; --accent-dim:#e7f1fc;
    --accent-line:#cfe4f9; --code:#0075de; --code-bg:#e7f1fc;
    --mark:#0075de; --mark-bg:#e7f1fc; --muted:#615d59;
    --sans:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',-apple-system,sans-serif;
    --rad:12px; --radsm:8px;
  }
  [data-theme="dark"]{
    --bg:#191919; --panel:#202020; --panel2:#252525;
    --line:#343434; --text:#e9e9e7; --sub:#8f8d88; --accent:#4a9eff;
    --accent-dim:rgba(74,158,255,.16); --accent-line:rgba(74,158,255,.35);
    --mark:#4a9eff; --mark-bg:rgba(74,158,255,.18); --code:#4a9eff; --code-bg:rgba(74,158,255,.14); --muted:#b4b2ad;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent);} a:hover{color:var(--text);}
  .wrap{max-width:1180px;margin:0 auto;padding:40px 36px 64px;}
  header{position:relative;}
  .crumb{display:flex;gap:6px;font-size:12.5px;color:var(--sub);margin-bottom:18px;}
  .crumb a{color:var(--sub);text-decoration:none;} .crumb a:hover{color:var(--accent);}
  header h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.2;}
  .theme-toggle{position:absolute;right:0;top:0;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:3px;cursor:pointer;}
  .theme-toggle span{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:100px;color:var(--sub);}
  .theme-toggle .tg-sun{background:var(--panel2);color:var(--text);}
  [data-theme="dark"] .theme-toggle .tg-sun{background:transparent;color:var(--sub);}
  [data-theme="dark"] .theme-toggle .tg-moon{background:var(--panel2);color:var(--text);}

  /* 자료 탭 */
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:24px;}
  .tab{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:var(--text);display:flex;flex-direction:column;gap:4px;}
  .tab:hover{border-color:var(--accent-line);}
  .tab .t1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.02em;}
  .tab .t1 .n{font-size:12.5px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums;}
  .tab .t2{font-size:12px;color:var(--sub);line-height:1.45;}
  .tab.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-dim);}
  .tab.on .t1{color:var(--accent);} .tab.on .t1 .n{color:var(--accent);}

  .searchbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;}
  .sb-field{position:relative;flex:1;min-width:240px;}
  .sb-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none;}
  .searchbar input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px 10px 38px;border-radius:var(--radsm);font-size:13.5px;font-family:var(--sans);}
  .searchbar input:focus{outline:none;border-color:var(--accent);}
  .searchbar input::placeholder{color:var(--sub);}
  .count{color:var(--sub);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .xbtn{background:var(--panel);border:1px solid var(--line);border-radius:var(--radsm);padding:9px 13px;font:inherit;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap;}
  .xbtn:hover{border-color:var(--accent);color:var(--accent);}
  .xbtn.ok{border-color:var(--accent);color:var(--accent);}

  /* 공통 네비 요소 */
  .nav-h{padding:0 4px 8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--sub);}
  .gj,.cat{padding:7px 9px;font-size:13px;color:var(--text);cursor:pointer;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .gj:hover,.cat:hover{background:var(--panel2);}
  .gj.on,.cat.on{background:var(--accent-dim);color:var(--accent);font-weight:700;}
  .cn{font-size:11.5px;color:var(--sub);flex-shrink:0;font-variant-numeric:tabular-nums;font-weight:500;}
  .on .cn{color:var(--accent);}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:100px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--text);}
  .chip:hover{border-color:var(--accent-line);}
  .chip.on{background:var(--text);border-color:var(--text);color:var(--panel);font-weight:700;}
  .chip.on .cn{color:var(--panel);opacity:.7;}
  select.catsel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radsm);padding:9px 10px;font:inherit;font-size:12.5px;color:var(--text);max-width:260px;}

  .layout{display:grid;gap:18px;margin-top:18px;align-items:start;}
  aside.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;}
  aside.side::-webkit-scrollbar{width:7px;} aside.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px;}
  main{min-width:0;}
  .gjbar,.catstrip{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
  .catstrip{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin:0 0 10px;}
  .catstrip::-webkit-scrollbar{height:6px;} .catstrip::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
  .hint{font-size:12.5px;color:var(--sub);padding:6px 2px 10px;}
  .subs{margin:2px 0 6px 10px;padding-left:8px;border-left:2px solid var(--accent-line);}
  .subs .cat{font-size:12.5px;padding:5px 8px;}

  /* 시안별 */
  [data-layout="A"] .layout{grid-template-columns:minmax(0,1fr);}
  [data-layout="B"] .layout,[data-layout="C"] .layout{grid-template-columns:220px minmax(0,1fr);}
  [data-layout="A"] aside.side,[data-layout="A"] .catstrip{display:none;}
  [data-layout="B"] .gjbar,[data-layout="C"] .gjbar,[data-layout="B"] select.catsel,[data-layout="C"] select.catsel,[data-layout="B"] .catstrip{display:none;}

  .content{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);overflow-x:auto;}
  .empty{padding:56px 24px;text-align:center;color:var(--sub);font-size:13.5px;}
  table.rt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;}
  table.rt th,table.rt td{border-bottom:1px solid var(--line);padding:11px 14px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.rt thead th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--sub);font-weight:700;font-size:11.5px;}
  table.rt th.l,table.rt td.l{text-align:left;white-space:normal;}
  table.rt tbody tr:hover td{background:var(--panel2);}
  table.rt td.nm{font-weight:700;white-space:normal;word-break:break-word;}
  table.rt td.nm .nm-spec{font-weight:400;color:var(--sub);font-size:11.5px;display:block;margin-top:2px;}
  table.rt td.nm .ho-badge{display:table;font-size:10.5px;color:var(--code);background:var(--code-bg);padding:1px 6px;border-radius:4px;margin:5px 0 0;font-weight:700;}
  table.rt td.spec{color:var(--sub);font-size:12.5px;}
  table.rt td.unit,table.rt th.unit{text-align:center;font-size:11.5px;color:var(--sub);}
  table.rt td.sum{font-weight:700;}
  table.rt td.code{text-align:left;white-space:normal;word-break:break-all;}
  table.rt td.nm.clk{cursor:pointer;}
  table.rt td.nm.clk:hover,table.rt td.nm.clk.open{color:var(--accent);}
  table.rt col.c-nm{width:36%;} table.rt col.c-num{width:11%;} table.rt col.c-sum{width:12%;} table.rt col.c-code{width:12%;}
  .r-code{font-size:11px;color:var(--code);background:var(--code-bg);padding:1px 7px;border-radius:4px;font-weight:700;}

  tr.dtl-row > td{padding:0!important;background:var(--panel2);}
  .dtl{margin:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--rad);overflow:hidden;}
  .dtl-h{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--accent-dim);border-bottom:1px solid var(--line);}
  .dtl-h .tt{flex:1;min-width:0;font-weight:700;font-size:14.5px;}
  .dtl-h .tt small{display:block;font-weight:400;color:var(--sub);font-size:12px;}
  .dtl-x{background:var(--panel);border:1px solid var(--line);color:var(--sub);width:30px;height:30px;border-radius:6px;font-size:18px;cursor:pointer;}
  table.bd{width:100%;border-collapse:collapse;font-size:13px;}
  table.bd th,table.bd td{border-bottom:1px solid var(--line);padding:9px 11px;text-align:right;white-space:normal;font-variant-numeric:tabular-nums;line-height:1.5;}
  table.bd thead th{background:var(--panel2);color:var(--sub);font-weight:700;font-size:11.5px;}
  table.bd th.l,table.bd td.l{text-align:left;}
  table.bd td.nm{font-weight:700;}
  table.bd td.bigo{color:var(--muted);font-size:12px;}
  table.bd tfoot td{background:var(--accent-dim);font-weight:700;color:var(--accent);border-bottom:0;}
  .remark{padding:12px 16px;font-size:12.5px;line-height:1.7;color:var(--muted);border-top:1px solid var(--line);}
  .remark b{color:var(--text);}
  mark{background:var(--mark-bg);color:var(--mark);padding:0 1px;border-radius:2px;}
  footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.8;}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:9px 16px;border-radius:100px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.on{opacity:1;}

  @media(max-width:1080px){ table.rt td.code,table.rt th.code,table.rt td.spec,table.rt th.spec{display:none;} }
  @media(max-width:900px){
    .tabs{grid-template-columns:minmax(0,1fr);}
    [data-layout="B"] .layout,[data-layout="C"] .layout{grid-template-columns:minmax(0,1fr);}
    aside.side{position:static;max-height:220px;border:1px solid var(--line);border-radius:var(--radsm);padding:10px 8px;background:var(--panel);}
  }
  @media(max-width:760px){ .wrap{padding:26px 16px 48px;} header h1{font-size:24px;} table.bd td.bigo,table.bd th.bigo{display:none;} }
</style>
</head>

<script>
(function(){
  var LAYOUT=document.documentElement.getAttribute('data-layout')||'A';
  var D=window.DANGA_DATA||{ilwi:[],mat:[]};
  var DI=window.DANGA_INT||{cats:[],items:[],bd:{},rm:{}};
  D.int=DI.items;
  var root=document.documentElement, $=function(id){return document.getElementById(id);};
  try{ if(localStorage.getItem('danga-theme')==='dark') root.setAttribute('data-theme','dark'); }catch(e){}
  $('themeToggle').addEventListener('click',function(){
    var d=root.getAttribute('data-theme')==='dark';
    if(d) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','dark');
    try{localStorage.setItem('danga-theme',d?'light':'dark');}catch(e){}
  });
  ['ilwi','int','mat'].forEach(function(t){ $('n-'+t).textContent=(D[t]||[]).length.toLocaleString(); });

  var GJLIST=[
    {n:'가설공사',kw:['가설','비계','동바리','규준','건축물 설치 및 해체','안전시설']},
    {n:'기초 및 토공사',kw:['터파기','되메우기','잔토','토사','굴착','다짐','성토','절토','흙막이','파일','항타','지정','기초','운반/단지']},
    {n:'철근콘크리트공사',kw:['철근','콘크리트','거푸집','타설','레미콘','버림','철물']},
    {n:'철골공사',kw:['철골','세우기','데크','볼트','용접','앵커']},

    {n:'방수공사',kw:['방수','실링','방습필름','아스팔트','코킹']},
    {n:'타일공사',kw:['타일','압착','떠붙이기']},
    {n:'석공사',kw:['석공사','화강석','대리석','석재','판석','현무암']},
    {n:'목공사',kw:['목공','합판','각재','방부','목재','졸대']},
    {n:'금속공사',kw:['금속','스테인리스','스테인레스','알루미늄','난간','트렌치','논슬립','금속판','셔터박스']},
    {n:'미장공사',kw:['미장','몰탈','모르타르','방바닥','시멘트바름','견출','셀프레벨링']},
    {n:'창호공사',kw:['창호','도어','방화문','자동문','셔터','창짝','문틀']},
    {n:'유리공사',kw:['유리','복층','페어글라스','거울','강화유리']},
    {n:'도장공사',kw:['페인트','도장','붓칠','롤러칠','뿜칠','녹막이','바니시','락카','에나멜']},
    {n:'수장공사',kw:['도배','바닥재','시트','카펫','걸레받이','몰딩','인조광물섬유판','흡음','천장','석고보드','단열','발포폴리스티렌','압출발포','케이싱','마루','데코타일']},
    {n:'지붕 및 홈통공사',kw:['지붕','홈통','기와','징크','물받이','선홈통','처마']},
    {n:'유지보수공사',kw:['유지보수','재도장','보수','보강']},
    {n:'철거공사',kw:['철거','해체','파쇄','절단','제거']},
    {n:'운반비',kw:['운반비','상차','하차','소운반','기계운반']},
    {n:'소규모건설공사',kw:['소규모']}
  ];
  function classify(x){
    var s=((x.c||'')+' '+(x.n||'')).toLowerCase();
    if(/소규모건설|\(소규모/.test(s)) return 20;
    if(/(모래|자갈|잡석|골재|시멘트|조약돌|호박돌)\s*운반/.test(s)) return 19;
    for(var i=0;i<GJLIST.length;i++){ var kw=GJLIST[i].kw; for(var j=0;j<kw.length;j++){ if(s.indexOf(kw[j].toLowerCase())>=0) return i+1; } }
    return 0;
  }
  (D.mat||[]).forEach(function(x){ x.k=classify(x); });
  var GJNAMES={ilwi:GJLIST.map(function(g){return g.n;}), mat:GJLIST.map(function(g){return g.n;}), int:DI.cats};
  var SRC={ilwi:'건축 일위대가',int:'실내건축 일위대가',mat:'자재단가'};

  var TYPE='ilwi', GJ=0, CAT='', Q='', CAP=300, lastShown=[];
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function hl(s){ s=s||''; if(!Q) return esc(s); var i=s.toLowerCase().indexOf(Q); if(i<0) return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+Q.length))+'</mark>'+esc(s.slice(i+Q.length)); }
  function won(n){ return (n||0).toLocaleString(); }
  function byGj(){ return (D[TYPE]||[]).filter(function(x){ return GJ===0?true:(GJ===-1?x.k===0:x.k===GJ); }); }
  function filtered(){ return byGj().filter(function(x){ if(CAT&&(x.c||'기타')!==CAT) return false; if(!Q) return true; return (x.n+' '+(x.s||'')+' '+(x.g||'')+' '+(x.ho||'')).toLowerCase().indexOf(Q)>=0; }); }
  function gjItems(){
    var all=D[TYPE]||[], m={}; all.forEach(function(x){ m[x.k]=(m[x.k]||0)+1; });
    var arr=[{g:0,n:'전체',c:all.length}];
    GJNAMES[TYPE].forEach(function(n,i){ if(m[i+1]) arr.push({g:i+1,n:n,c:m[i+1]}); });
    if(m[0]) arr.push({g:-1,n:'기타',c:m[0]});
    return arr;
  }
  function catItems(){
    if(TYPE==='mat') return [];
    var m={}; byGj().forEach(function(x){ var c=x.c||'기타'; m[c]=(m[c]||0)+1; });
    return Object.keys(m).sort(function(a,b){return m[b]-m[a];}).map(function(c){return {c:c,n:m[c]};});
  }
  function buildNav(){
    var gjs=gjItems(), cats=catItems(), h='';
    if(LAYOUT==='A'){
      $('gjbar').innerHTML=gjs.map(function(g){return '<span class="chip'+(GJ===g.g?' on':'')+'" data-g="'+g.g+'">'+esc(g.n)+' <span class="cn">'+g.c.toLocaleString()+'</span></span>';}).join('');
      var sel=$('catsel'); sel.style.display=cats.length?'':'none';
      sel.innerHTML='<option value="">세부 분류 전체 ('+cats.length+')</option>'+cats.map(function(c){return '<option value="'+esc(c.c)+'"'+(CAT===c.c?' selected':'')+'>'+esc(c.c)+' ('+c.n+')</option>';}).join('');
    } else {
      h='<div class="nav-h">공종</div>';
      gjs.forEach(function(g){
        h+='<div class="gj'+(GJ===g.g?' on':'')+'" data-g="'+g.g+'">'+esc(g.n)+' <span class="cn">'+g.c.toLocaleString()+'</span></div>';
        if(LAYOUT==='B'&&GJ===g.g&&GJ!==0&&cats.length){
          h+='<div class="subs"><div class="cat'+(CAT===''?' on':'')+'" data-c="">전체 <span class="cn">'+g.c+'</span></div>'
            +cats.map(function(c){return '<div class="cat'+(CAT===c.c?' on':'')+'" data-c="'+esc(c.c)+'">'+esc(c.c)+' <span class="cn">'+c.n+'</span></div>';}).join('')+'</div>';
        }
      });
      $('side').innerHTML=h;
      if(LAYOUT==='C'){
        var st=$('catstrip');
        if(TYPE==='mat'){ st.style.display='none'; }
        else if(GJ===0){ st.style.display=''; st.innerHTML='<div class="hint">왼쪽에서 공종을 고르면 세부 분류가 여기에 나타납니다.</div>'; }
        else { st.style.display=''; st.innerHTML='<span class="chip'+(CAT===''?' on':'')+'" data-c="">전체</span>'+cats.map(function(c){return '<span class="chip'+(CAT===c.c?' on':'')+'" data-c="'+esc(c.c)+'">'+esc(c.c)+' <span class="cn">'+c.n+'</span></span>';}).join(''); }
      }
    }
  }
  function onNav(e){
    var g=e.target.closest('[data-g]'), c=e.target.closest('[data-c]');
    if(c){ CAT=c.getAttribute('data-c'); }
    else if(g){ var v=+g.getAttribute('data-g'); GJ=(GJ===v&&LAYOUT==='B'&&v!==0)?GJ:v; CAT=''; }
    else return;
    buildNav(); render();
  }
  ['gjbar','side','catstrip'].forEach(function(id){ $(id).addEventListener('click',onNav); });
  $('catsel').addEventListener('change',function(){ CAT=this.value; render(); });

  function render(){
    var res=filtered(), content=$('content');
    $('count').textContent=res.length.toLocaleString()+'건'+(res.length>CAP?' (상위 '+CAP+'건 표시)':'');
    if(!res.length){ content.innerHTML='<div class="empty">검색 결과가 없습니다.</div>'; return; }
    var shown=res.slice(0,CAP), html;
    if(TYPE==='mat'){
      html='<table class="rt"><colgroup><col class="c-nm"><col><col class="c-num"><col class="c-sum"></colgroup><thead><tr><th class="l">품명</th><th class="l spec">규격</th><th class="unit">단위</th><th>적용단가</th></tr></thead><tbody>';
      shown.forEach(function(x){ html+='<tr><td class="l nm">'+hl(x.n)+'</td><td class="l spec">'+hl(x.s)+'</td><td class="unit">'+esc(x.u||'-')+'</td><td class="sum">'+won(x.p)+'</td></tr>'; });
    } else {
      var hasG=shown.some(function(r){return r.g;});
      html='<table class="rt"><colgroup><col class="c-nm">'+(hasG?'<col class="c-code">':'')+'<col style="width:8%"><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-sum"></colgroup><thead><tr><th class="l">품명</th>'+(hasG?'<th class="l code">품셈근거</th>':'')+'<th class="unit">단위</th><th>재료비</th><th>노무비</th><th>경비</th><th>합계</th></tr></thead><tbody>';
      shown.forEach(function(y,j){
        html+='<tr><td class="l nm clk" data-i="'+j+'">'+hl(y.n)+(y.s?'<span class="nm-spec">'+hl(y.s)+'</span>':'')+(y.ho?'<span class="ho-badge">'+esc(y.ho)+'</span>':'')+'</td>'
          +(hasG?'<td class="l code">'+(y.g?'<span class="r-code">'+esc(y.g)+'</span>':'')+'</td>':'')
          +'<td class="unit">'+esc(y.u||'-')+'</td><td>'+won(y.m)+'</td><td>'+won(y.l)+'</td><td>'+won(y.e)+'</td><td class="sum">'+won(y.t)+'</td></tr>';
      });
    }
    content.innerHTML=html+'</tbody></table>';
    lastShown=shown;
  }

  var bdLoading=false;
  function loadBd(cb){
    if(TYPE==='int'||window.DANGA_BD){ cb(); return; }
    var wait=setInterval(function(){ if(window.DANGA_BD){clearInterval(wait);cb();} },80);
    if(bdLoading) return; bdLoading=true;
    var s=document.createElement('script'); s.src='danga_bd.js'; s.onerror=function(){clearInterval(wait);bdLoading=false;}; document.body.appendChild(s);
  }
  function bdHtml(item){
    var rows=(TYPE==='int'?DI.bd:(window.DANGA_BD||{}))[item.id]||[];
    if(!rows.length) return '<div class="empty" style="padding:26px">등록된 호표 내역이 없습니다.</div>';
    var tm=0,tl=0,te=0;
    var h='<table class="bd"><thead><tr><th class="l">품명 · 규격</th><th>단위</th><th>수량</th><th>재료비</th><th>노무비</th><th>경비</th><th>합계</th><th class="l bigo">비고</th></tr></thead><tbody>';
    rows.forEach(function(r){ tm+=r.m;tl+=r.l;te+=r.e;
      h+='<tr><td class="l nm">'+esc(r.n)+(r.s?' <span style="font-weight:400;color:var(--sub)">· '+esc(r.s)+'</span>':'')+'</td><td>'+esc(r.u)+'</td><td>'+(r.q||'')+'</td><td>'+won(r.m)+'</td><td>'+won(r.l)+'</td><td>'+won(r.e)+'</td><td style="font-weight:700">'+won(r.t)+'</td><td class="l bigo">'+esc(r.x)+'</td></tr>'; });
    h+='</tbody><tfoot><tr><td class="l" colspan="3">합계</td><td>'+won(tm)+'</td><td>'+won(tl)+'</td><td>'+won(te)+'</td><td>'+won(item.t)+'</td><td class="bigo"></td></tr></tfoot></table>';
    var rm=TYPE==='int'?(DI.rm[item.id]||[]):[];
    if(rm.length) h+='<div class="remark"><b>REMARK</b><br>'+rm.map(esc).join('<br>')+'</div>';
    return h;
  }
  function closeDtl(){ var r=$('content').querySelector('tr.dtl-row'); if(r) r.parentNode.removeChild(r); var o=$('content').querySelector('td.clk.open'); if(o) o.classList.remove('open'); }
  $('content').addEventListener('click',function(e){
    if(e.target.closest('.dtl-x')){ closeDtl(); return; }
    var td=e.target.closest('td.clk'); if(!td) return;
    var was=td.classList.contains('open'); closeDtl(); if(was) return;
    td.classList.add('open');
    var item=lastShown[+td.getAttribute('data-i')], tr=td.parentNode;
    var row=document.createElement('tr'); row.className='dtl-row';
    row.innerHTML='<td colspan="'+tr.children.length+'"><div class="dtl"><div class="dtl-h"><div class="tt">'+esc(item.n)+'<small>'+esc([item.ho,item.s,item.u?'단위 '+item.u:''].filter(Boolean).join(' · '))+'</small></div><button class="dtl-x" title="닫기">×</button></div><div class="dtl-b"><div class="empty" style="padding:26px">불러오는 중…</div></div></div></td>';
    tr.parentNode.insertBefore(row,tr.nextSibling);
    loadBd(function(){ row.querySelector('.dtl-b').innerHTML=bdHtml(item); });
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDtl(); });

  function exportRows(){
    var res=filtered();
    if(TYPE==='mat') return [['품명','규격','단위','적용단가']].concat(res.map(function(x){return [x.n,x.s||'',x.u||'',x.p||0];}));
    return [['호표','품명','규격','단위','재료비','노무비','경비','합계']].concat(res.map(function(x){return [x.ho||'',x.n,x.s||'',x.u||'',x.m||0,x.l||0,x.e||0,x.t||0];}));
  }
  function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){t.classList.remove('on');},1800); }
  $('btnCopy').addEventListener('click',function(){
    var rows=exportRows(), tsv=rows.map(function(r){return r.map(function(v){return String(v).replace(/[\t\n]/g,' ');}).join('\t');}).join('\n');
    var done=function(){ toast((rows.length-1).toLocaleString()+'건 복사됨 · 엑셀에 붙여넣기'); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(tsv).then(done,fallback); } else fallback();
    function fallback(){ var ta=document.createElement('textarea'); ta.value=tsv; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){} ta.remove(); }
  });
  $('btnCsv').addEventListener('click',function(){
    var rows=exportRows(), csv=rows.map(function(r){return r.map(function(v){v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');
    var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='일위대가_'+SRC[TYPE]+(GJ>0?'_'+GJNAMES[TYPE][GJ-1]:'')+'.csv';
    document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
    toast((rows.length-1).toLocaleString()+'건 다운로드');
  });

  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); TYPE=b.getAttribute('data-t'); GJ=0; CAT=''; buildNav(); render();
    });
  });
  var tm; $('q').addEventListener('input',function(){ var v=this.value; clearTimeout(tm); tm=setTimeout(function(){ Q=v.trim().toLowerCase(); render(); },160); });
  buildNav(); render();
})();
</script>
<script src="close-button.js" defer></script>
</body>
</html>
