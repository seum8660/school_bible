<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>2026년 상반기 일위대가(건축) 단가 검색</title>
<style>
  :root{
    --bg:#f6f5f4; --panel:#ffffff; --panel2:#f6f5f4; --line:#e6e6e6;
    --text:#000000; --sub:#a39e98; --accent:#0075de; --accent-dim:#e7f1fc;
    --accent-line:#cfe4f9; --code:#0075de; --code-bg:#e7f1fc;
    --mark:#0075de; --mark-bg:#e7f1fc; --muted:#615d59;
    --mono:'Pretendard','Malgun Gothic',sans-serif;
    --sans:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',-apple-system,sans-serif;
    --rad:12px; --radsm:8px;
    --shadow:none;
    --shadow-sm:none;
    --glassbd:1px solid #e6e6e6;
  }
  [data-theme="dark"]{
    --bg:#191919; --panel:#202020; --panel2:#252525;
    --line:#343434; --text:#e9e9e7; --sub:#8f8d88; --accent:#4a9eff;
    --accent-dim:rgba(74,158,255,.16); --accent-line:rgba(74,158,255,.35);
    --mark:#4a9eff; --mark-bg:rgba(74,158,255,.18); --code:#4a9eff; --code-bg:rgba(74,158,255,.14); --muted:#b4b2ad;
    --shadow:none; --shadow-sm:none;
    --glassbd:1px solid #343434;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;
    -webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
  .wrap{max-width:1180px;margin:0 auto;padding:40px 36px 64px;}
  header{padding:0;border:0;background:none;position:relative;}
  .crumb{display:flex;gap:6px;font-size:12.5px;color:var(--sub);margin-bottom:18px;}
  .crumb a{color:var(--sub);text-decoration:none;}
  .crumb a:hover{color:var(--accent);}
  .hd-top{text-align:left;margin-bottom:0;}
  header h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.2;}
  header .sub{color:var(--muted);font-size:14px;margin-top:8px;}
  .theme-toggle{position:absolute;right:0;top:0;display:flex;align-items:center;gap:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:3px;cursor:pointer;}
  .theme-toggle span{width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    font-size:13px;border-radius:100px;color:var(--sub);}
  .theme-toggle .tg-sun{background:var(--panel2);color:var(--text);}
  [data-theme="dark"] .theme-toggle .tg-sun{background:transparent;color:var(--sub);}
  [data-theme="dark"] .theme-toggle .tg-moon{background:var(--panel2);color:var(--text);}
  .meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .meta div{display:flex;gap:10px;align-items:baseline;font-size:13px;}
  .meta .lb{color:var(--sub);}
  .meta .vl{color:var(--text);font-weight:500;}

  .searchbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:22px;}
  .sb-field{position:relative;flex:1;min-width:260px;}
  .sb-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none;}
  .searchbar input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:10px 14px 10px 38px;border-radius:var(--radsm);font-size:13.5px;font-family:var(--sans);box-shadow:none;}
  .searchbar input:focus{outline:none;border-color:var(--accent);}
  .searchbar input::placeholder{color:var(--sub);}
  .searchbar .count{color:var(--sub);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .kpi{display:flex;gap:4px;flex-wrap:wrap;order:-1;}
  .kpi button{background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:9px 14px;
    font:inherit;font-size:12.5px;font-weight:500;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:7px;}
  .kpi button .n{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .kpi button.on{background:var(--text);border-color:var(--text);color:var(--panel);font-weight:700;}
  .kpi button.on .n{color:var(--panel);opacity:.7;}

  .layout{display:grid;grid-template-columns:180px 210px minmax(0,1fr);gap:18px;margin-top:20px;align-items:start;}
  nav.sidebar-gj,nav.sidebar{position:sticky;top:16px;width:auto;background:none;border:0;padding:0;max-height:none;overflow:visible;}
  nav.sidebar-gj .cat-h,nav.sidebar .cat-h{padding:0 4px 8px;font-size:11.5px;font-weight:700;
    letter-spacing:.08em;color:var(--sub);text-transform:uppercase;}
  nav.sidebar-gj .gj,nav.sidebar .cat{padding:7px 9px;font-size:13px;color:var(--text);cursor:pointer;
    border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  nav.sidebar-gj .gj:hover,nav.sidebar .cat:hover{background:var(--panel2);}
  nav.sidebar-gj .gj.on,nav.sidebar .cat.on{background:var(--accent-dim);color:var(--accent);font-weight:700;}
  nav.sidebar-gj .gj .cn,nav.sidebar .cat .cn{font-size:11.5px;color:var(--sub);flex-shrink:0;font-variant-numeric:tabular-nums;}
  nav.sidebar-gj .gj.on .cn,nav.sidebar .cat.on .cn{color:var(--accent);}
  main{min-width:0;}
  .content{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);overflow-x:auto;}
  .empty,.loading{padding:56px 24px;text-align:center;color:var(--sub);font-size:13.5px;}

  table.rt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;}
  table.rt th,table.rt td{border-bottom:1px solid var(--line);padding:11px 14px;text-align:right;
    white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.rt thead th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--sub);
    font-weight:700;font-size:11.5px;letter-spacing:.02em;border-bottom:1px solid var(--line);}
  table.rt th.l,table.rt td.l{text-align:left;white-space:normal;}
  table.rt tbody tr:last-child td{border-bottom:0;}
  table.rt tbody tr:hover td{background:var(--panel2);}
  table.rt td.nm{font-weight:700;color:var(--text);white-space:normal;word-break:break-word;}
  table.rt td.nm .nm-spec{font-weight:400;color:var(--sub);font-size:11.5px;display:block;margin-top:2px;white-space:normal;}
  table.rt td.nm .ho-badge{display:table;font-size:10.5px;color:var(--code);background:var(--code-bg);
    padding:1px 6px;border-radius:4px;margin:5px 0 0;font-weight:700;}
  table.rt td.spec{color:var(--sub);font-size:12.5px;}
  table.rt td.unit,table.rt th.unit{text-align:center;font-size:11.5px;color:var(--sub);}
  table.rt td.num{color:var(--text);}
  table.rt td.sum{font-weight:700;color:var(--text);}
  table.rt td.bigo,table.rt th.bigo{text-align:center;color:var(--sub);font-size:12px;}
  table.rt td.code{text-align:left;white-space:normal;word-break:break-all;}
  table.rt td.nm.clk{color:var(--text);cursor:pointer;}
  table.rt td.nm.clk:hover{color:var(--accent);}
  table.rt td.nm.clk.open{color:var(--accent);}
  table.rt col.c-nm{width:34%;} table.rt col.c-spec{width:0;}
  table.rt col.c-num{width:11%;} table.rt col.c-sum{width:12%;}
  table.rt col.c-code{width:11%;} table.rt col.c-bigo{width:7%;}
  .r-code{font-size:11px;color:var(--code);background:var(--code-bg);padding:1px 7px;border-radius:4px;font-weight:700;}

  /* 호표 상세 (허장 행 인라인 카드) */
  .drawer{display:none;margin-top:22px;}
  .drawer.on{display:block;}
  tr.dtl-row > td{padding:0!important;background:var(--panel2);}
  tr.dtl-row .drawer{display:block;margin:14px;}
  tr.dtl-row .modal-box{border-left:3px solid var(--accent);}
  tr.dtl-row .drawer-h{background:var(--accent-dim);}
  tr.dtl-row:hover > td{background:var(--panel2)!important;}
  .drawer>.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);
    box-shadow:none;width:auto;max-height:none;display:flex;flex-direction:column;overflow:hidden;}
  .drawer-h{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);background:var(--panel2);}
  .dh-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
  .dh-t .ho{order:2;}
  .dh-nm{order:1;}
  .dh-sub{order:3;}
  .dh-t .ho{font-size:11px;color:var(--code);background:var(--code-bg);padding:2px 8px;border-radius:4px;font-weight:700;}
  .dh-nm{font-size:15px;font-weight:700;letter-spacing:-.02em;}
  .dh-sub{font-size:12.5px;color:var(--sub);}
  .drawer-x{background:var(--panel);border:1px solid var(--line);color:var(--sub);width:32px;height:32px;
    border-radius:6px;font-size:19px;cursor:pointer;flex-shrink:0;}
  .drawer-x:hover{color:var(--text);border-color:var(--accent);}
  .drawer-b{overflow:visible;}
  .drawer table.bd thead th{position:static;}
  .drawer table.bd tfoot td{position:static;}
  table.bd{width:100%;table-layout:auto;border-collapse:collapse;font-size:13px;background:var(--panel);}
  table.bd th{white-space:normal;}
  table.bd{width:100%;table-layout:auto;border-collapse:collapse;font-size:13px;background:var(--panel);}
  table.bd th,table.bd td{border-bottom:1px solid var(--line);padding:10px 11px;text-align:right;
    white-space:normal;font-variant-numeric:tabular-nums;line-height:1.5;}
  @media(max-width:900px){
    table.bd th,table.bd td{padding:7px 8px;font-size:12.5px;}
  }
  @media(max-width:640px){
    table.bd td.bigo,table.bd th.l:last-child{display:none;}
  }
  table.bd td.nm,table.bd th.l,table.bd td.bigo{white-space:normal;word-break:break-word;}
  table.bd td.bigo{color:var(--muted);font-size:12px;padding-left:14px;}
  table.bd th.l:last-child{padding-left:14px;}
  table.bd td.nm,table.bd td.num,table.bd td.sumcell{font-size:13px;}
  table.bd thead th{position:sticky;top:0;background:var(--accent-dim);color:var(--accent);font-weight:700;
    font-size:11.5px;z-index:1;border-bottom:1px solid var(--accent-line);}
  table.bd th.l,table.bd td.l{text-align:left;}
  table.bd td.nm{font-weight:700;color:var(--text);}
  table.bd tbody tr:hover td{background:var(--panel2);}
  table.bd td.sumcell{font-weight:700;color:var(--text);}
  table.bd tfoot td{position:static;background:var(--accent-dim);font-weight:700;
    border-top:1px solid var(--accent-line);border-bottom:0;font-size:13px;}
  table.bd tfoot td.sum{color:var(--accent);}
  mark{background:var(--mark-bg);color:var(--mark);padding:0 1px;border-radius:2px;}
  footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--sub);
    font-size:12px;line-height:1.8;}
  nav.sidebar-gj,nav.sidebar{max-height:520px;overflow-y:auto;}
  @media(max-width:1000px){
    .layout{grid-template-columns:1fr 1fr;gap:14px;}
    nav.sidebar-gj,nav.sidebar{position:static;max-height:190px;overflow-y:auto;
      border:1px solid var(--line);border-radius:var(--radsm);padding:10px 8px;background:var(--panel);}
    main{grid-column:1 / -1;}
  }
  @media(max-width:620px){
    .layout{grid-template-columns:1fr;}
  }
  nav.sidebar-gj::-webkit-scrollbar,nav.sidebar::-webkit-scrollbar{width:7px;}
  nav.sidebar-gj::-webkit-scrollbar-thumb,nav.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px;}
  @media(max-width:760px){
    .wrap{padding:26px 16px 48px;}
    header h1{font-size:24px;}
    table.rt td.spec,table.rt th.spec,table.rt td.code,table.rt th.code{display:none;}
  }
  @media(max-width:1080px){
    table.rt td.code,table.rt th.code,table.rt td.spec,table.rt th.spec{display:none;}
  }
</style>
</head>

<script>
(function(){
  var D = window.DANGA_DATA || {ilwi:[],dan:[],mat:[]};
  var root=document.documentElement;
  // theme
  var tgl=document.getElementById('themeToggle');
  try{ if(localStorage.getItem('danga-theme')==='dark') root.setAttribute('data-theme','dark'); }catch(e){}
  tgl.addEventListener('click',function(){
    var d=root.getAttribute('data-theme')==='dark';
    if(d){root.removeAttribute('data-theme');} else {root.setAttribute('data-theme','dark');}
    try{localStorage.setItem('danga-theme',d?'light':'dark');}catch(e){}
  });

  var mt=document.getElementById('m-total');
  if(mt) mt.textContent=(((D.ilwi||[]).length+(D.mat||[]).length)).toLocaleString()+'건';
  document.getElementById('n-ilwi').textContent=(D.ilwi||[]).length.toLocaleString();
  document.getElementById('n-mat').textContent=(D.mat||[]).length.toLocaleString();

  var TYPE='ilwi', CAT='', GJ=0, Q='', CAP=300;
  var q=document.getElementById('q'), content=document.getElementById('content'),
      sidebar=document.getElementById('sidebar'), sidebarGj=document.getElementById('sidebar-gj'), count=document.getElementById('count');

  // ===== 20개 대공종 분류 =====
  var GJLIST=[
    {n:'가설공사',kw:['가설','비계','동바리','규준','건축물 설치 및 해체','안전시설']},
    {n:'기초 및 토공사',kw:['터파기','되메우기','잔토','토사','굴착','다짐','성토','절토','흙막이','파일','항타','지정','기초','운반/단지']},
    {n:'철근콘크리트공사',kw:['철근','콘크리트','거푸집','타설','레미콘','버림','철물']},
    {n:'철골공사',kw:['철골','세우기','데크','볼트','용접','앵커']},
    {n:'조적공사',kw:['조적','벽돌','블록','쌓기']},
    {n:'방수공사',kw:['방수','실링','방습필름','아스팔트','코킹']},
    {n:'타일공사',kw:['타일','압착','떠붙이기','압착 붙이기']},
    {n:'석공사',kw:['석공사','화강석','대리석','석재','판석','현무암']},
    {n:'목공사',kw:['목공','합판','각재','방부','목재','졸대']},
    {n:'금속공사',kw:['금속','스테인리스','스테인레스','알루미늄','난간','트렌치','논슬립','금속판','셔터박스']},
    {n:'미장공사',kw:['미장','몰탈','모르타르','방바닥','시멘트바름','견출','셀프레벨링','뿜칠 미장']},
    {n:'창호공사',kw:['창호','도어','방화문','자동문','셔터','창짝','문틀']},
    {n:'유리공사',kw:['유리','복층','페어글라스','거울','강화유리']},
    {n:'도장공사',kw:['페인트','도장','붓칠','롤러칠','뿜칠','녹막이','바니시','락카','에나멜','스테인 칠']},
    {n:'수장공사',kw:['도배','바닥재','시트','카펫','걸레받이','몰딩','인조광물섬유판','흡음','천장','석고보드','단열','발포폴리스티렌','압출발포','케이싱','마루','데코타일','우물천장']},
    {n:'지붕 및 홈통공사',kw:['지붕','홈통','기와','징크','물받이','선홈통','처마']},
    {n:'유지보수공사',kw:['유지보수','재도장','보수','보강']},
    {n:'철거공사',kw:['철거','해체','파쇄','절단','제거']},
    {n:'운반비',kw:['운반비','상차','하차','소운반','기계운반']},
    {n:'소규모건설공사',kw:['소규모']}
  ];
  function classify(x){
    var s=((x.c||'')+' '+(x.n||'')).toLowerCase();
    // 우선 분류: 소규모건설·운반비(골재류)
    if(/소규모건설|\(소규모/.test(s)) return 20;
    if(/(모래|자갈|잡석|골재|시멘트|조약돌|호박돌)\s*운반/.test(s)) return 19;
    for(var i=0;i<GJLIST.length;i++){ var kw=GJLIST[i].kw; for(var j=0;j<kw.length;j++){ if(s.indexOf(kw[j].toLowerCase())>=0) return i+1; } }
    return 0;
  }
  ['mat'].forEach(function(tp){ (D[tp]||[]).forEach(function(x){ x.k=classify(x); }); });

  function rows(){ return (D[TYPE]||[]).filter(function(x){ if(GJ===0) return true; if(GJ===-1) return x.k===0; return x.k===GJ; }); }
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function hl(s){ if(!Q) return esc(s); var i=s.toLowerCase().indexOf(Q); if(i<0) return esc(s);
    return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+Q.length))+'</mark>'+esc(s.slice(i+Q.length)); }
  function won(n){ return (n||0).toLocaleString(); }

  function buildGj(){
    var all=D[TYPE]||[], m={};
    all.forEach(function(x){ m[x.k]=(m[x.k]||0)+1; });
    var html='<div class="cat-h">공종 구분</div>';
    html+='<div class="gj'+(GJ===0?' on':'')+'" data-g="0">전체 <span class="cn">'+all.length.toLocaleString()+'</span></div>';
    GJLIST.forEach(function(g,i){ var cnt=m[i+1]||0; html+='<div class="gj'+(GJ===i+1?' on':'')+'" data-g="'+(i+1)+'">'+esc(g.n)+' <span class="cn">'+cnt+'</span></div>'; });
    var etc=m[0]||0; if(etc) html+='<div class="gj'+(GJ===-1?' on':'')+'" data-g="-1">기타 <span class="cn">'+etc+'</span></div>';
    sidebarGj.innerHTML=html;
    Array.prototype.forEach.call(sidebarGj.querySelectorAll('.gj'),function(el){
      el.addEventListener('click',function(){ GJ=+el.getAttribute('data-g'); CAT=''; buildGj(); buildCats(); render(); });
    });
  }

  function buildCats(){
    var list=rows(), m={};
    list.forEach(function(x){ var c=x.c||'기타'; m[c]=(m[c]||0)+1; });
    var cats=Object.keys(m).sort(function(a,b){return m[b]-m[a];});
    var html='<div class="cat-h">'+({ilwi:'세부 분류',mat:'자재 분류'}[TYPE]||'분류')+'</div>';
    html+='<div class="cat'+(CAT===''?' on':'')+'" data-c="">전체 <span class="cn">'+list.length.toLocaleString()+'</span></div>';
    if(TYPE!=='mat'){
      cats.forEach(function(c){ html+='<div class="cat'+(CAT===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+' <span class="cn">'+m[c]+'</span></div>'; });
    }
    sidebar.innerHTML=html;
    Array.prototype.forEach.call(sidebar.querySelectorAll('.cat'),function(el){
      el.addEventListener('click',function(){ CAT=el.getAttribute('data-c'); buildCats(); render(); });
    });
  }

  function filtered(){
    var list=rows();
    return list.filter(function(x){
      if(CAT && (x.c||'기타')!==CAT) return false;
      if(!Q) return true;
      return (x.n+' '+x.s+' '+(x.g||'')).toLowerCase().indexOf(Q)>=0;
    });
  }

  function render(){
    var res=filtered();
    count.textContent=res.length.toLocaleString()+'건'+(res.length>CAP?' (상위 '+CAP+'건 표시)':'');
    if(!res.length){ content.innerHTML='<div class="empty">검색 결과가 없습니다.</div>'; return; }
    var shown=res.slice(0,CAP), html;
    if(TYPE==='mat'){
      html='<table class="rt"><colgroup><col class="c-nm"><col class="c-spec"><col class="c-num"><col class="c-sum"></colgroup>'
        +'<thead><tr><th class="l">품명</th><th class="l spec">규격</th><th class="unit">단위</th><th>적용단가</th></tr></thead><tbody>';
      for(var i=0;i<shown.length;i++){ var x=shown[i];
        html+='<tr><td class="l nm">'+hl(x.n)+'</td><td class="l spec">'+hl(x.s||'')+'</td>'
          +'<td class="unit">'+esc(x.u||'-')+'</td><td class="sum">'+won(x.p)+'</td></tr>';
      }
      html+='</tbody></table>';
    } else {
      var hasG=shown.some(function(r){return r.g;});
      html='<table class="rt"><colgroup><col class="c-nm">'+(hasG?'<col class="c-code">':'')+'<col class="c-num"><col class="c-num"><col class="c-num"><col class="c-sum"><col class="c-bigo"></colgroup>'
        +'<thead><tr><th class="l">품명</th>'+(hasG?'<th class="l code">품셈근거</th>':'')+'<th class="unit">단위</th><th>재료비</th><th>노무비</th><th>경비</th><th>합계</th><th class="bigo">비고</th></tr></thead><tbody>';
      var clk=(TYPE==='ilwi')?' clk':'';
      for(var j=0;j<shown.length;j++){ var y=shown[j];
        html+='<tr><td class="l nm'+clk+'" data-id="'+esc(y.id||'')+'" data-i="'+j+'">'+hl(y.n)+(y.ho?'<span class="ho-badge">'+esc(y.ho)+'</span>':'')+(y.s?'<span class="nm-spec">'+hl(y.s)+' · 단위 '+esc(y.u||'-')+'</span>':'')+'</td>'
          +(hasG?'<td class="l code">'+(y.g?'<span class="r-code">'+esc(y.g)+'</span>':'')+'</td>':'')
          +'<td class="unit">'+esc(y.u||'-')+'</td>'
          +'<td class="num">'+won(y.m)+'</td><td class="num">'+won(y.l)+'</td><td class="num">'+won(y.e)+'</td>'
          +'<td class="sum">'+won(y.t)+'</td><td class="bigo"></td></tr>';
      }
      html+='</tbody></table>';
    }
    content.innerHTML=html;
    content.scrollTop=0;
    if(TYPE==='ilwi') lastShown=shown;
  }

  // ===== 호표 상세 모달 =====
  var lastShown=[], bdLoading=false;
  function closeM(){}
  function loadBd(cb){
    if(window.DANGA_BD){ cb(); return; }
    var wait=setInterval(function(){ if(window.DANGA_BD){clearInterval(wait);cb();} },80);
    if(bdLoading) return;
    bdLoading=true;
    var s=document.createElement('script'); s.src='danga_bd.js';
    s.onerror=function(){ clearInterval(wait); bdLoading=false; };
    document.body.appendChild(s);
  }
  function bdTableHtml(item){
    var rows=(window.DANGA_BD||{})[item.id]||[];
    if(!rows.length) return '<div style="padding:30px;text-align:center;color:var(--sub)">등록된 호표 내역이 없습니다.</div>';
    var tm=0,tl=0,te=0;
    var h='<table class="bd"><thead><tr><th class="l">품명 · 규격</th><th>단위</th><th>수량</th><th>재료비</th><th>노무비</th><th>경비</th><th>합계</th><th class="l">비고</th></tr></thead><tbody>';
    rows.forEach(function(r){ tm+=r.m;tl+=r.l;te+=r.e;
      h+='<tr><td class="l nm">'+esc(r.n)+(r.s?' <span style="font-weight:400;color:var(--sub)">· '+esc(r.s)+'</span>':'')+'</td><td>'+esc(r.u||'')+'</td>'
        +'<td class="num">'+(r.q||'')+'</td><td class="num">'+won(r.m)+'</td><td class="num">'+won(r.l)+'</td><td class="num">'+won(r.e)+'</td>'
        +'<td class="sumcell">'+won(r.t)+'</td><td class="l bigo">'+esc(r.x||'')+'</td></tr>';
    });
    h+='</tbody><tfoot><tr><td class="l" colspan="3">[ 합계 ]</td><td class="sum">'+won(tm)+'</td><td class="sum">'+won(tl)+'</td><td class="sum">'+won(te)+'</td><td class="sum">'+won(item.t)+'</td><td></td></tr></tfoot></table>';
    return h;
  }
  var drawer=document.getElementById('drawer'), dHo=document.getElementById('d-ho'),
      dNm=document.getElementById('d-nm'), dSub=document.getElementById('d-sub'), dBody=document.getElementById('d-body');
  var drawerHome=document.getElementById('drawer').parentNode;
  function closeDrawer(){
    drawer.classList.remove('on'); content.classList.remove('with-drawer');
    var o=content.querySelector('td.nm.clk.open'); if(o)o.classList.remove('open');
    var row=content.querySelector('tr.dtl-row');
    if(row){ drawerHome.appendChild(drawer); row.parentNode.removeChild(row); }
  }
  document.getElementById('d-x').addEventListener('click',closeDrawer);
  drawer.addEventListener('click',function(e){ if(e.target===drawer) closeDrawer(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDrawer(); });
  content.addEventListener('click',function(e){
    var td=e.target.closest('td.nm.clk'); if(!td || TYPE!=='ilwi') return;
    var wasOpen=td.classList.contains('open');
    closeDrawer();
    if(wasOpen) return;
    td.classList.add('open');
    var idx=+td.getAttribute('data-i'); var item=lastShown[idx]; if(!item) return;
    dHo.textContent=item.ho||'호표'; dNm.textContent=item.n; dSub.textContent=(item.s?item.s+'  ':'')+(item.u?'· 단위 '+item.u:'');
    dBody.innerHTML='<div style="padding:30px;text-align:center;color:var(--sub)">불러오는 중…</div>';
    drawer.classList.add('on'); content.classList.add('with-drawer');
    var tr=td.parentNode, cols=tr.children.length;
    var row=document.createElement('tr'); row.className='dtl-row';
    var cellTd=document.createElement('td'); cellTd.setAttribute('colspan',cols);
    row.appendChild(cellTd); cellTd.appendChild(drawer);
    tr.parentNode.insertBefore(row, tr.nextSibling);
    loadBd(function(){ dBody.innerHTML=bdTableHtml(item); });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.kpi button'),function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.kpi button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); TYPE=b.getAttribute('data-t'); CAT=''; GJ=0; buildGj(); buildCats(); render();
    });
  });
  var t;
  q.addEventListener('input',function(){ clearTimeout(t); t=setTimeout(function(){ Q=q.value.trim().toLowerCase(); render(); },160); });

  buildGj(); buildCats(); render();
})();
</script>
</body>
</html>
