<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>정산이 — 준공정산 (준비중)</title>
<style>
  :root{--bg:#f2f4f6;--panel:#fff;--panel2:#f7f9fb;--line:#c4ccd6;--ink:#191f28;--sub:#8b95a1;--accent:#1a1d21;--accent-dim:#eceef1;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Malgun Gothic',sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:44px 40px;max-width:560px;width:100%;
        box-shadow:0 1px 3px rgba(0,27,55,.05),0 10px 30px rgba(0,27,55,.07);text-align:center}
  .ic{width:74px;height:74px;margin:0 auto 20px;border-radius:20px;background:var(--accent-dim);color:var(--accent);
      display:flex;align-items:center;justify-content:center;font-size:34px}
  h1{margin:0 0 8px;font-size:24px;font-weight:900;letter-spacing:-.8px}
  .tag{display:inline-block;font-size:11.5px;font-weight:800;color:var(--accent);background:var(--accent-dim);
       padding:4px 12px;border-radius:100px;margin-bottom:16px}
  p{margin:0 0 22px;font-size:14px;color:var(--sub);line-height:1.7}
  .list{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:22px}
  .list h2{margin:0 0 10px;font-size:12.5px;font-weight:800;color:var(--ink)}
  .list ul{margin:0;padding-left:18px;font-size:13px;color:var(--sub);line-height:1.85}
  .bar{height:8px;background:var(--panel2);border:1.5px solid var(--line);border-radius:100px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;width:20%;background:var(--accent);border-radius:100px}
  .pct{font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:24px}
  a.home{display:inline-block;text-decoration:none;background:var(--accent);color:#fff;font-weight:800;font-size:13.5px;
         padding:11px 22px;border-radius:100px}
  a.home:hover{opacity:.9}
</style>
</head>
<body>
<div class="card">
  <div class="ic">🧮</div>
  <div class="tag">준비 중</div>
  <h1>정산이 — 준공정산</h1>
  <p>준공검사·정산 단계의 서류와 금액을 한 번에 정리하는 도구입니다.<br>현재 개발 중이며 순차적으로 공개됩니다.</p>
  <div class="list">
    <h2>준비 중인 기능</h2>
    <ul>
      <li>설계변경·계약금액 조정 내역 정리</li>
      <li>산업안전보건관리비 사용·정산 확인</li>
      <li>환경보전비·폐기물처리비 정산</li>
      <li>감리(건설사업관리) 용역비 정산</li>
      <li>준공정산 조서 자동 작성 · 엑셀 내보내기</li>
    </ul>
  </div>
  <div class="bar"><i></i></div>
  <div class="pct">개발 진행률 20%</div>
  <a class="home" href="index.html">← 치트키로 돌아가기</a>
</div>
</body>
</html>
